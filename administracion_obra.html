<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Administración de Obra</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
        }

        .background {
            background-image: url('fondo_admin.jpg');
            background-size: cover; 
            background-position: center; 
            height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }

        h1 {
            color: #ffd700;
            font-weight: 800;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.7rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .obra-tag {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        .btn-menu {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px 15px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            text-align: center;
        }

        .btn-menu:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #ffd700;
            transform: translateY(-3px);
            color: #ffd700;
        }

        /* Estilo especial para el icono de DPV */
        .icon-dpv {
            height: 24px;
            width: auto;
            filter: drop-shadow(0px 0px 2px rgba(0,0,0,0.5));
        }

        .btn-volver {
            margin-top: 25px;
            background: transparent;
            border: none;
            color: #ff6b6b;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .credits {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="background">
    <div class="glass-panel">
        <h1>Administración de Obra</h1>
        <div id="obra-activa" class="obra-tag">Obra: Cargando...</div>

        <div class="menu-grid">
            <button class="btn-menu" onclick="window.location.href='partes_diarios.html'">
                📝 Partes Diarios
            </button>
            <button class="btn-menu" onclick="window.location.href='control_personal.html'">
                👥 Control Personal
            </button>
            <button class="btn-menu" onclick="window.location.href='control_equipos.html'">
                🚜 Control Equipos
            </button>
            <button class="btn-menu" onclick="window.location.href='documentacion.html'">
                📁 Documentación
            </button>
            <button class="btn-menu" onclick="window.location.href='personal_inspeccion.html'" style="grid-column: span 2;">
                <img src="Logo dpv.png" alt="DPV" class="icon-dpv"> Personal Inspección D.P.V.
            </button>
        </div>

        <button class="btn-volver" onclick="window.location.href='panel_control.html'">
            ⬅ Volver al Menú Principal
        </button>
    </div>

    <div class="credits">S.I.G.I.V. - Gestión Administrativa</div>
</div>

<script>
    window.onload = function() {
        const obraActual = sessionStorage.getItem('obraActual');
        if (obraActual) {
            document.getElementById('obra-activa').innerText = `Obra: ${obraActual}`;
        } else {
            window.location.href = 'obras.html';
        }
    };
</script>

</body>
</html>
