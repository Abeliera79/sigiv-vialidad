<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Control de Alumbrado</title>
    <style>
        :root {
            --vialidad-blue: #005596;
            --ocre-light: #b08d5c;
            --ocre-gold: #ffd700;
            --glass-bg: rgba(10, 15, 20, 0.9);
            --border-gold: rgba(176, 141, 92, 0.4);
            --danger: #c0392b;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #050a10 url('fondo_iluminaria.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #e0e0e0;
            overflow: hidden;
        }

        .background-overlay {
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
        }

        .main-container {
            width: 96%; max-width: 1400px; height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-gold);
            border-radius: 20px; padding: 25px;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .header-sigiv {
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 2px solid var(--ocre-light);
            padding-bottom: 10px; margin-bottom: 20px;
        }

        h2 { color: var(--ocre-gold); text-transform: uppercase; letter-spacing: 3px; margin: 0; font-size: 1.6rem; }

        .control-panel { display: flex; gap: 12px; margin-bottom: 20px; }

        .btn {
            padding: 10px 18px; border-radius: 8px; border: none;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
            font-size: 0.75rem; transition: 0.3s; color: white;
        }
        .btn-edit { background: var(--ocre-light); color: #000; }
        .btn-edit.active { background: var(--ocre-gold); box-shadow: 0 0 15px var(--ocre-gold); }
        .btn-add { background: #2980b9; }
        .btn-del { background: var(--danger); }
        .btn-print { background: #444; }

        .table-wrapper {
            flex-grow: 1; overflow-y: auto;
            border-radius: 10px; background: rgba(0,0,0,0.2);
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th {
            background: rgba(176, 141, 92, 0.2); color: var(--ocre-gold);
            padding: 12px; text-align: center; position: sticky; top: 0;
            border-bottom: 2px solid var(--ocre-light); z-index: 5;
            text-transform: uppercase; font-size: 0.7rem;
        }

        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }

        .field-input {
            background: transparent; border: 1px solid transparent;
            color: white; width: 95%; padding: 5px; text-align: center;
            border-radius: 4px; outline: none;
        }
        .edit-mode .field-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(176,141,92,0.3); }

        .ojo-link { cursor: pointer; font-size: 1.2rem; display: none; }

        .footer { margin-top: 20px; }
        .btn-back {
            background: transparent; border: 1px solid #ff6b6b; color: #ff6b6b;
            padding: 10px 25px; border-radius: 10px; font-weight: bold; cursor: pointer;
        }
        .btn-back:hover { background: #ff6b6b; color: white; }

        @media print {
            .control-panel, .footer, th:first-child, td:first-child, input[type="file"] { display: none !important; }
            .main-container { background: white; color: black; border: none; width: 100%; height: auto; }
            h2, th { color: black; border-bottom: 2px solid black; }
            .field-input { color: black !important; }
        }
    </style>
</head>
<body>

<div class="background-overlay">
    <div class="main-container" id="mainWrapper">
        <div class="header-sigiv">
            <div>
                <h2>Control de Alumbrado</h2>
                <div style="font-size: 0.7rem; color: #aaa; margin-top: 4px;">S.I.G.I.V. - Gestión de Infraestructura Vial</div>
            </div>
            <div id="txtModo" style="font-size: 0.8rem; font-weight: bold; color: var(--ocre-light);">MODO LECTURA</div>
        </div>

        <div class="control-panel">
            <button class="btn btn-edit" id="btnModo" onclick="toggleEdit()">Editar</button>
            <button class="btn btn-add" id="btnAdd" onclick="agregarFila()" style="display:none">+ Nueva Fila</button>
            <button class="btn btn-del" onclick="eliminarFilas()">Eliminar</button>
            <button class="btn btn-print" onclick="window.print()">Imprimir</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th width="40">Sel.</th>
                        <th width="100">Fecha</th>
                        <th>Tipo</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th width="100">Prog. I</th>
                        <th width="100">Prog. F</th>
                        <th>Detalle</th>
                        <th width="120">Imagen</th>
                    </tr>
                </thead>
                <tbody id="tb"></tbody>
            </table>
        </div>

        <div class="footer">
            <button class="btn-back" onclick="volver()">⬅ VOLVER AL PANEL DE OBRA</button>
        </div>
    </div>
</div>

<script>
    var editando = false;
    var hayCambios = false;
    var fotos = {};

    function toggleEdit() {
        editando = !editando;
        var wrapper = document.getElementById("mainWrapper");
        var btn = document.getElementById("btnModo");
        var btnAdd = document.getElementById("btnAdd");
        var txt = document.getElementById("txtModo");
        
        wrapper.classList.toggle("edit-mode");
        btn.innerText = editando ? "BLOQUEAR" : "EDITAR";
        btn.classList.toggle("active");
        btnAdd.style.display = editando ? "inline-block" : "none";
        txt.innerText = editando ? "EDICIÓN ACTIVA" : "MODO LECTURA";
        txt.style.color = editando ? "var(--ocre-gold)" : "var(--ocre-light)";

        var ins = document.querySelectorAll(".field-input, .ch, input[type='file']");
        ins.forEach(i => i.disabled = !editando);

        var ojs = document.querySelectorAll(".ojo-link");
        ojs.forEach(o => o.style.display = editando ? "none" : "inline-block");

        if(!editando) hayCambios = false;
    }

    function agregarFila() {
        if(!editando) return;
        var id = Date.now();
        var tbody = document.getElementById("tb");
        var r = tbody.insertRow();
        
        r.innerHTML = `
            <td><input type="checkbox" class="ch"></td>
            <td><input type="date" class="field-input" onchange="hC()"></td>
            <td><input type="text" class="field-input" oninput="hC()"></td>
            <td><input type="text" class="field-input" oninput="hC()"></td>
            <td><input type="text" class="field-input" oninput="hC()"></td>
            <td><input type="number" step="0.01" class="field-input" oninput="hC()"></td>
            <td><input type="number" step="0.01" class="field-input" oninput="hC()"></td>
            <td><input type="text" class="field-input" oninput="hC()"></td>
            <td>
                <span class="ojo-link" onclick="verFoto(${id})">👁️</span>
                <input type="file" style="width:80px;font-size:10px" onchange="subirFoto(this, ${id})">
            </td>
        `;
        hayCambios = true;
    }

    function hC() { hayCambios = true; }

    function subirFoto(input, id) {
        if(input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) { fotos[id] = e.target.result; hayCambios = true; };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function verFoto(id) {
        if(fotos[id]) {
            var w = window.open("");
            w.document.write('<img src="'+fotos[id]+'" style="width:100%">');
        } else alert("Sin imagen");
    }

    function eliminarFilas() {
        if(!editando) return alert("Active EDITAR");
        var cs = document.querySelectorAll(".ch:checked");
        if(cs.length > 0) {
            if(confirm("¿Eliminar filas seleccionadas?")) {
                cs.forEach(c => c.closest("tr").remove());
                hayCambios = true;
            }
        } else alert("Seleccione filas");
    }

    function volver() {
        if (editando && hayCambios) {
            if (!confirm("Hay cambios sin bloquear. ¿Deseas salir?")) return;
        }
        window.location.href = 'control_obra.html'; 
    }

    // Al cargar: Crear fila inicial y bloquear
    window.onload = function() {
        editando = true;
        agregarFila();
        toggleEdit();
    };
</script>
</body>
</html>
