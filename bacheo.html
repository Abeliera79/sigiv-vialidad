<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Control de Bacheo</title>
    <style>
        :root {
            --vialidad-blue: #005596;
            --ocre-light: #ffd700;
            --ocre-dark: #b08d5c;
            --glass-bg: rgba(0, 0, 0, 0.85);
            --border-gold: rgba(255, 215, 0, 0.3);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
            overflow: hidden;
        }

        .background-container {
            background-image: url('fondo_bacheo.jpg');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .planilla-container {
            width: 98%;
            max-width: 1450px;
            height: 92vh;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Cabecera SIGIV */
        .header-sigiv {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--ocre-light);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        h2 {
            color: var(--ocre-light);
            font-weight: 800;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.5rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .sub-tag {
            color: #ccc;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modo-indicador {
            font-size: 0.8rem;
            color: var(--ocre-light);
            font-weight: bold;
        }

        /* Controles */
        .btn-controles {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            border: none;
            font-size: 0.75rem;
            color: white;
        }

        .btn-edit { background: var(--ocre-light); color: #000; }
        .btn-add { background: #2980b9; display: none; }
        .btn-del { background: #c0392b; }
        .btn-print { background: #555; }
        .btn-save { background: #27ae60; display: none; }

        /* Tabla Estilizada */
        .table-wrapper {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid rgba(255,215,0,0.1);
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            table-layout: fixed;
        }

        th {
            background: rgba(255, 215, 0, 0.1);
            color: var(--ocre-light);
            padding: 10px 5px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid var(--ocre-light);
            text-transform: uppercase;
            font-size: 0.65rem;
        }

        td {
            padding: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        input, select {
            background: transparent;
            border: 1px solid transparent;
            color: white;
            width: 95%;
            padding: 4px;
            text-align: center;
            border-radius: 4px;
        }

        .edit-active input, .edit-active select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        input:disabled, select:disabled {
            color: #eee;
            opacity: 1;
            -webkit-text-fill-color: #eee;
        }

        .calc-res {
            color: var(--ocre-light);
            font-weight: bold;
        }

        /* Footer */
        .footer-btns {
            margin-top: 15px;
            display: flex;
            justify-content: flex-start;
        }

        .btn-back {
            background: transparent;
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-back:hover { background: #ff6b6b; color: white; }

        @media print {
            .btn-controles, .footer-btns, th:first-child, td:first-child { display: none !important; }
            .planilla-container { background: white; color: black; border: none; box-shadow: none; width: 100%; height: auto; }
            h2, .modo-indicador, th { color: black; border-color: black; }
            input, select { color: black !important; border: none !important; }
            .calc-res { color: black; }
        }
    </style>
</head>
<body>

<div class="background-container">
    <div class="planilla-container" id="mainWrapper">
        <div class="header-sigiv">
            <div>
                <h2>Control de Bacheo</h2>
                <div class="sub-tag">S.I.G.I.V. - Reparación y Conservación de Calzada</div>
            </div>
            <div class="modo-indicador">
                MODO: <span id="indicadorModo">LECTURA</span>
            </div>
        </div>

        <div class="btn-controles">
            <button id="btnEditar" class="btn btn-edit" onclick="toggleEditar()">Habilitar Edición</button>
            <button id="btnGuardar" class="btn btn-save" onclick="toggleEditar()">Finalizar y Guardar</button>
            <button id="btnAgregar" class="btn btn-add" onclick="agregarFila()">+ Nueva Fila</button>
            <button class="btn btn-del" onclick="eliminarFilas()">Eliminar</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir</button>
        </div>

        <div class="table-wrapper">
            <table id="tablaBacheo">
                <thead>
                    <tr>
                        <th style="width: 30px;">Sel.</th>
                        <th style="width: 90px;">Fecha</th>
                        <th style="width: 70px;">S/R.P. nº</th>
                        <th style="width: 75px;">Prog. Ini</th>
                        <th style="width: 75px;">Prog. Fin</th>
                        <th style="width: 100px;">Tipo Mat.</th>
                        <th style="width: 100px;">Tipo Bache</th>
                        <th style="width: 100px;">Denom. Bache</th>
                        <th style="width: 65px;">Largo (m)</th>
                        <th style="width: 65px;">Ancho (m)</th>
                        <th style="width: 70px;">Espesor</th>
                        <th style="width: 70px;">M2</th>
                        <th style="width: 70px;">M3</th>
                        <th style="width: 70px;">P. Esp.</th>
                        <th style="width: 75px;">Tn.</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>

        <div class="footer-btns">
            <button onclick="confirmarVolver()" class="btn-back">⬅ VOLVER AL PANEL DE OBRA</button>
        </div>
    </div>
</div>

<script>
    let modoEdicion = false;
    let datosModificados = false;

    function toggleEditar() {
        modoEdicion = !modoEdicion;
        const wrapper = document.getElementById('mainWrapper');
        const btnEdit = document.getElementById('btnEditar');
        const btnSave = document.getElementById('btnGuardar');
        const btnAdd = document.getElementById('btnAgregar');
        const ind = document.getElementById('indicadorModo');
        const inputs = document.querySelectorAll('input, select');

        if(modoEdicion) {
            wrapper.classList.add('edit-active');
            btnEdit.style.display = "none";
            btnSave.style.display = "inline-block";
            btnAdd.style.display = "inline-block";
            ind.innerText = "EDICIÓN ACTIVA";
            ind.style.color = "#f87171";
            inputs.forEach(i => i.disabled = false);
        } else {
            wrapper.classList.remove('edit-active');
            btnEdit.style.display = "inline-block";
            btnSave.style.display = "none";
            btnAdd.style.display = "none";
            ind.innerText = "LECTURA";
            ind.style.color = "var(--ocre-light)";
            inputs.forEach(i => i.disabled = true);
            if(datosModificados) alert("Datos sincronizados con el sistema central S.I.G.I.V.");
        }
    }

    function agregarFila() {
        const tbody = document.getElementById('tableBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="checkbox" class="row-sel"></td>
            <td><input type="date" value="${new Date().toISOString().split('T')[0]}"></td>
            <td><input type="text" placeholder="---"></td>
            <td><input type="number" step="0.01"></td>
            <td><input type="number" step="0.01"></td>
            <td>
                <select>
                    <option value="En Caliente">En Caliente</option>
                    <option value="En Frio">En Frío</option>
                </select>
            </td>
            <td>
                <select>
                    <option value="NUEVO">NUEVO</option>
                    <option value="RECONSTRUCCION TOTAL">RECONSTR. TOTAL</option>
                    <option value="RECONSTRUCION PARC.">RECONSTR. PARC.</option>
                </select>
            </td>
            <td>
                <select>
                    <option value="BACHE">BACHE</option>
                    <option value="BACHE CERO">BACHE CERO</option>
                    <option value="CARPETIN">CARPETÍN</option>
                    <option value="TEXTURADO">TEXTURADO</option>
                </select>
            </td>
            <td><input type="number" class="v-largo" oninput="calcularBacheo(this)" step="0.01"></td>
            <td><input type="number" class="v-ancho" oninput="calcularBacheo(this)" step="0.01"></td>
            <td><input type="number" class="v-espesor" oninput="calcularBacheo(this)" step="0.001"></td>
            <td class="calc-res v-m2">0.00</td>
            <td class="calc-res v-m3">0.000</td>
            <td><input type="number" class="v-peso" oninput="calcularBacheo(this)" value="2.40" step="0.01"></td>
            <td class="calc-res v-tn" style="background: rgba(255,215,0,0.05);">0.00</td>
        `;
        tbody.appendChild(tr);
        datosModificados = true;
    }

    function calcularBacheo(el) {
        const tr = el.closest('tr');
        
        const largo = parseFloat(tr.querySelector('.v-largo').value) || 0;
        const ancho = parseFloat(tr.querySelector('.v-ancho').value) || 0;
        const espesor = parseFloat(tr.querySelector('.v-espesor').value) || 0;
        const peso = parseFloat(tr.querySelector('.v-peso').value) || 0;

        const m2 = largo * ancho;
        tr.querySelector('.v-m2').innerText = m2.toFixed(2);

        const m3 = m2 * espesor;
        tr.querySelector('.v-m3').innerText = m3.toFixed(3);

        const tn = m3 * peso;
        tr.querySelector('.v-tn').innerText = tn.toFixed(2);

        datosModificados = true;
    }

    function eliminarFilas() {
        const sel = document.querySelectorAll('.row-sel:checked');
        if(sel.length === 0) return alert("Seleccione registros para eliminar.");
        if(confirm(`¿Desea eliminar los ${sel.length} registros seleccionados?`)) {
            sel.forEach(cb => cb.closest('tr').remove());
            datosModificados = true;
        }
    }

    function confirmarVolver() {
        if(datosModificados && modoEdicion) {
            if(confirm("Hay cambios sin guardar. ¿Desea guardarlos antes de salir?")) {
                toggleEditar();
            }
        }
        window.location.href = 'control_obra.html';
    }

    // Inicializar con 3 filas vacías
    window.onload = () => {
        for(let i=0; i<3; i++) agregarFila();
        toggleEditar(); toggleEditar(); // Forzar estado lectura inicial
    }
</script>

</body>
</html>
