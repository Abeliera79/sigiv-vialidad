<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Control de Personal</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; color: white; overflow-x: hidden;
        }
        .background {
            background-image: url('fondo_personal.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 0;
        }
        .glass-panel {
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; padding: 30px;
            width: 95%; max-width: 1200px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
        }
        .header-sigiv {
            text-align: center; border-bottom: 2px solid #ffd700; margin-bottom: 30px;
            padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        h1 { color: #ffd700; font-weight: 800; margin: 0; text-transform: uppercase; letter-spacing: 3px; font-size: 1.5rem; }
        .btn { padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; border: none; font-size: 0.75rem; }
        .btn-edit { background: #ffd700; color: #000; }
        .btn-save { background: #27ae60; color: white; display: none; }
        .btn-add { background: #2980b9; color: white; margin-right: 5px; }
        .btn-del { background: #c0392b; color: white; }
        .edit-active .btn-save { display: inline-block; }
        .edit-active .btn-edit { display: none; }
        .section-box { margin-bottom: 25px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 215, 0, 0.1); border-radius: 12px; overflow: hidden; }
        .section-title { background: rgba(255, 215, 0, 0.1); padding: 12px 20px; color: #ffd700; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }
        .btn-action { visibility: hidden; opacity: 0; transition: 0.3s; }
        .edit-active .btn-action { visibility: visible; opacity: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { padding: 10px; color: #aaa; text-transform: uppercase; font-size: 0.7rem; border-bottom: 1px solid rgba(255,215,0,0.2); }
        td { padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        
        /* ESTILOS DE INPUT Y SELECT */
        .field-input { 
            background: transparent; border: 1px solid transparent; color: white; 
            width: 90%; padding: 5px; text-align: center; outline: none; border-radius: 4px;
        }
        .edit-active .field-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 215, 0, 0.2); }
        
        /* CORRECCIÓN VISIBILIDAD SELECT */
        select.field-input { cursor: pointer; }
        select.field-input option {
            background-color: white !important;
            color: black !important;
        }

        .btn-back { background: transparent; border: 1px solid #ff6b6b; color: #ff6b6b; padding: 10px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; text-transform: uppercase; }
        .btn-back:hover { background: #ff6b6b; color: white; }
    </style>
</head>
<body>
<div class="background">
    <div class="glass-panel" id="mainWrapper">
        <div class="header-sigiv">
            <div>
                <h1>Control de Personal</h1>
                <div id="obra-tag" style="color: #ccc; font-size: 0.9rem; margin-top: 5px; text-align: left;">Obra: Cargando...</div>
            </div>
            <div>
                <button class="btn btn-edit" id="btnEdit" onclick="toggleEdit()">Habilitar Edición</button>
                <button class="btn btn-save" id="btnSave" onclick="toggleEdit()">Finalizar Edición</button>
                <button class="btn" style="background:#444; color:white; margin-left: 10px;" onclick="window.print()">Imprimir</button>
            </div>
        </div>
        <div id="sectionsContainer"></div>
        <button onclick="safeBack()" class="btn-back">⬅ Volver a Administración</button>
    </div>
</div>
<script>
    let editMode = false;
    
    // LISTA ACTUALIZADA DE CARGOS
    const opcionesCargos = [
        "....", 
        "Rep. Técnico", "Jefe Obra", "Ayudante Técnico", "Tec. Seg. Higiene", "Proyectista", 
        "Administrador", "Ayudante Admin.", "Encargado Compras", "Jefe taller", "Mecánico", 
        "Mantenimiento Eq.", "Pañolero", "Chofer", "Maquinista", "Capataz", "Puntero Cuadrilla", 
        "Plantista", "Calderista", "Juntero", "Ayudante", "Sereno",
        "Dir. Construcciones", "Presidente", "Ing. Jefe", "Inspector", "Conductor", "Sobrestante", "Laboratorista"
    ];

    const planillas = [
        { id: "jefatura", nombre: "Jefatura de Obra" }, 
        { id: "admin", nombre: "Administración de Obra" }, 
        { id: "suelo", nombre: "Equipo Movimiento de Suelo" }, 
        { id: "asfalto", nombre: "Equipo Carpeta Asfáltica" }, 
        { id: "hormigon", nombre: "Equipo Hormigón" }, 
        { id: "cantera", nombre: "Equipo Cantera" }, 
        { id: "topo", nombre: "Equipo Topografía" }, 
        { id: "taller", nombre: "Equipo Taller" }, 
        { id: "planta", nombre: "Equipo Planta de Asfalto" }, 
        { id: "labo", nombre: "Equipo Laboratorio" }, 
        { id: "grales", nombre: "Equipo Tareas Generales" }, 
        { id: "inspeccion", nombre: "Equipo Inspeccion de Obra" }
    ];

    function renderPlanillas() {
        const container = document.getElementById('sectionsContainer');
        const obraActual = sessionStorage.getItem('obraActual') || "No seleccionada";
        document.getElementById('obra-tag').innerText = "Obra: " + obraActual;
        
        container.innerHTML = ""; 
        planillas.forEach(p => {
            const div = document.createElement('div');
            div.className = 'section-box';
            div.innerHTML = '<div class="section-title">' + p.nombre + '<div class="btn-action"><button class="btn btn-add" onclick="addRow(\'' + p.id + '\')">+ Fila</button><button class="btn btn-del" onclick="deleteRows(\'' + p.id + '\')">Eliminar</button></div></div><table><thead><tr><th width="40">Sel.</th><th>Apellido</th><th>Nombre</th><th>Cargo / Especialidad</th><th width="80">Presente</th></tr></thead><tbody id="body-' + p.id + '"></tbody></table><div class="total-box">ACTIVOS EN SECCIÓN: <span id="total-' + p.id + '">0</span></div>';
            container.appendChild(div);
        });
    }

    function toggleEdit() {
        editMode = !editMode;
        document.getElementById('mainWrapper').classList.toggle('edit-active');
        document.getElementById('btnEdit').style.display = editMode ? 'none' : 'inline-block';
        document.getElementById('btnSave').style.display = editMode ? 'inline-block' : 'none';
    }

    function addRow(id) {
        const tbody = document.getElementById('body-' + id);
        const row = document.createElement('tr');
        let opts = opcionesCargos.map(o => '<option value="' + o + '">' + o + '</option>').join('');
        row.innerHTML = '<td><input type="checkbox" class="row-check"></td><td><input type="text" class="field-input" placeholder="Apellido"></td><td><input type="text" class="field-input" placeholder="Nombre"></td><td><select class="field-input">' + opts + '</select></td><td><input type="checkbox" class="check-estado" onchange="countActive(\'' + id + '\')"></td>';
        tbody.appendChild(row);
    }

    function countActive(id) {
        const count = document.querySelectorAll('#body-' + id + ' .check-estado:checked').length;
        document.getElementById('total-' + id).innerText = count;
    }

    function deleteRows(id) {
        const checks = document.querySelectorAll('#body-' + id + ' .row-check:checked');
        if(checks.length > 0 && confirm("¿Eliminar?")) {
            checks.forEach(c => c.closest('tr').remove());
            countActive(id);
        }
    }

    function safeBack() {
        const destino = 'administracion_obra.html'; 
        if (editMode) {
            if (confirm("⚠️ El modo EDICIÓN está activo. ¿Deseas salir?")) {
                window.location.href = destino;
            }
        } else {
            window.location.href = destino;
        }
    }

    renderPlanillas();
</script>
</body>
</html>
