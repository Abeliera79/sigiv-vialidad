<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>S.I.G.I.V. - Control de Personal de Inspección</title>
    <style>
        :root {
            --ocre-light: #b08d5c;
            --ocre-dark: #6e5535;
            --glass-bg: rgba(10, 15, 20, 0.85);
            --glass-header: rgba(176, 141, 92, 0.15);
            --border-gold: rgba(176, 141, 92, 0.3);
            --danger: #c0392b;
        }

        body {
            background: #050a10 url('fondo_planillasdpv.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .main-container {
            width: 95%; max-width: 1250px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-gold);
            border-radius: 15px; padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        h2 { color: var(--ocre-light); letter-spacing: 2px; text-transform: uppercase; margin-top: 0; }

        .control-panel { 
            display: flex; gap: 15px; margin-bottom: 25px; 
            background: var(--glass-header); padding: 15px; border-radius: 10px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: var(--glass-header); color: var(--ocre-light); padding: 12px; text-align: left; border-bottom: 2px solid var(--ocre-light); font-size: 0.85rem; }
        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* CORRECCIÓN DE VISIBILIDAD EN SELECT */
        .field-input {
            width: 100%; padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444; color: white;
            border-radius: 4px; outline: none;
        }
        
        /* Forzar texto negro cuando el desplegable se abre (fondo blanco del sistema) */
        .field-input option {
            background-color: white;
            color: black;
        }

        .btn {
            padding: 10px 18px; border-radius: 6px; border: none; font-weight: bold;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 0.75rem;
        }
        .btn-add { background: var(--ocre-light); color: #1a1c20; }
        .btn-add:hover { background: #d4af37; }
        .btn-back { background: transparent; border: 1px solid #666; color: #ccc; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

<div class="main-container">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
            <h2>Control de Personal de Inspección</h2>
            <p style="color: #888; font-size: 0.9rem;">Registro y asignación de funciones en obra</p>
        </div>
        <img src="Logo dpv.png" style="width: 70px; opacity: 0.8;">
    </div>

    <div class="control-panel">
        <button class="btn btn-add" onclick="addRow()">+ Agregar Personal</button>
        <button class="btn" style="background: var(--danger); color: white;" onclick="deleteRows()">Eliminar Seleccionados</button>
        <div style="margin-left: auto;">
            <span style="font-size: 0.8rem; color: var(--ocre-light);">TOTAL ACTIVOS: </span>
            <span id="totalPersonal" style="font-size: 1.2rem; font-weight: bold;">0</span>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 40px;"></th>
                <th>AFILIADO</th>
                <th>APELLIDO</th>
                <th>NOMBRE</th>
                <th>CARGO / ESPECIALIDAD</th>
                <th style="width: 80px; text-align: center;">ACTIVO</th>
            </tr>
        </thead>
        <tbody id="listaPersonal">
            </tbody>
    </table>

    <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
        <a href="personal_inspeccion.html" class="btn btn-back">⬅ Volver al Menú</a>
    </div>
</div>

<script>
    // Lista actualizada de cargos solicitada
    const CARGOS = [
        "Presidente",
        "Ing. Jefe",
        "Dir. Construcciones",
        "Inspector",
        "Sobrestante",
        "Conductor",
        "Laboratorista",
        "Administrativo",
        "Auxiliar"
    ];

    function addRow() {
        const tbody = document.getElementById('listaPersonal');
        const row = document.createElement('tr');
        
        let selectOptions = CARGOS.map(c => `<option value="${c}">${c}</option>`).join('');

        row.innerHTML = `
            <td><input type="checkbox" class="row-check"></td>
            <td><input type="text" class="field-input" placeholder="0000"></td>
            <td><input type="text" class="field-input" placeholder="Apellido"></td>
            <td><input type="text" class="field-input" placeholder="Nombre"></td>
            <td>
                <select class="field-input">
                    <option value="" disabled selected>Seleccione cargo...</option>
                    ${selectOptions}
                </select>
            </td>
            <td style="text-align: center;"><input type="checkbox" class="check-activo" onchange="updateTotal()"></td>
        `;
        tbody.appendChild(row);
    }

    function updateTotal() {
        const count = document.querySelectorAll('.check-activo:checked').length;
        document.getElementById('totalPersonal').innerText = count;
    }

    function deleteRows() {
        const checks = document.querySelectorAll('.row-check:checked');
        if(checks.length > 0 && confirm("¿Desea eliminar al personal seleccionado?")) {
            checks.forEach(c => c.closest('tr').remove());
            updateTotal();
        }
    }

    // Inicializar con una fila vacía
    window.onload = addRow;
</script>

</body>
</html>
