<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Gestión Documental</title>
    <style>
        :root {
            --ocre-light: #b08d5c;
            --ocre-dark: #6e5535;
            --glass-bg: rgba(10, 15, 20, 0.9);
            --border-gold: rgba(176, 141, 92, 0.4);
            --danger: #c0392b;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #050a10 url('fondo_documentacion.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        .main-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .table-container {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
        }

        .header-sigiv {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--ocre-light);
            margin-bottom: 25px;
            padding-bottom: 15px;
        }

        h1 {
            color: var(--ocre-light);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            font-size: 1.6rem;
        }

        .control-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border: none;
            transition: 0.3s;
            font-size: 0.8rem;
            color: white;
        }

        .btn-edit { background: var(--ocre-light); color: #000; }
        .btn-save { background: #27ae60; color: white; display: none; }
        .btn-add { background: #2980b9; color: white; display: none; }
        .btn-del { background: var(--danger); color: white; display: none; }
        .btn-view { background: #7f8c8d; color: white; padding: 5px 10px; display: none; font-size: 0.75rem; border-radius: 4px; }
        .btn-view:hover { background: #ffd700; color: black; }

        .edit-active .btn-save, .edit-active .btn-add, .edit-active .btn-del { display: inline-block; }
        .edit-active .btn-edit { display: none; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: rgba(176, 141, 92, 0.1);
            color: var(--ocre-light);
            padding: 15px;
            text-align: left;
            text-transform: uppercase;
            font-size: 0.75rem;
            border-bottom: 2px solid var(--border-gold);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .field-input {
            background: transparent;
            border: 1px solid transparent;
            color: white;
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
        }

        .edit-active .field-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-gold);
        }

        /* Bloqueo visual estricto de casilleros e inputs para Edge */
        .field-input:disabled, .row-chk:disabled, input[type="file"]:disabled {
            color: #aaa !important; opacity: 0.7 !important; background: transparent !important; border: 1px solid transparent !important; cursor: not-allowed;
        }

        .btn-back {
            background: transparent;
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 30px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-back:hover { background: #ff6b6b; color: white; }

        input[type="file"] { display: none; }

        .custom-file-upload {
            border: 1px solid var(--ocre-light);
            display: inline-block;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 0.8rem;
            color: var(--ocre-light);
            transition: 0.2s;
        }
        .custom-file-upload:hover { background: var(--ocre-light); color: black; }
        .custom-file-upload.disabled-label { border-color: #555 !important; color: #555 !important; cursor: not-allowed !important; background: transparent !important; }

        .edit-active .custom-file-upload {
            background: rgba(176, 141, 92, 0.2);
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="table-container" id="mainContainer">
        <div class="header-sigiv">
            <h1>Gestión Documental de Obra</h1>
            <div>
                <button class="btn btn-edit" id="btnEdit" onclick="toggleEdit()">Habilitar Edición</button>
                <button class="btn btn-save" id="btnSave" onclick="guardarYFinalizarDocumentos()">Guardar Cambios</button>
            </div>
        </div>

        <div class="control-panel">
            <button class="btn btn-add" id="btnFilaNueva" onclick="addRow()">+ Nueva Documentación</button>
            <button class="btn btn-del" id="btnBorrarFila" onclick="deleteRows()">Eliminar Seleccionados</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th width="40">Sel.</th>
                    <th>Tipo de Documento / Descripción</th>
                    <th>Fecha de Vencimiento / Emisión</th>
                    <th>Estado / Referencia</th>
                    <th>Archivo (PDF/IMG)</th>
                    <th width="100">Acción</th>
                </tr>
            </thead>
            <tbody id="documentTableBody"></tbody>
        </table>

        <button onclick="safeBack()" class="btn-back">⬅ Volver a Administración</button>
    </div>
</div>

<script>
    let editMode = false;
    let obraActual = sessionStorage.getItem('obraActual') || "Generica";
    let archivosCargadosMemoria = {}; // Repositorio binario temporal de lectura síncrona

    window.onload = function() {
        cargarDocumentosDesdeStorage();
    };

    function toggleEdit() {
        editMode = !editMode;
        document.getElementById('mainContainer').classList.toggle('edit-active', editMode);
        document.getElementById('btnEdit').style.display = editMode ? 'none' : 'inline-block';
        document.getElementById('btnSave').style.display = editMode ? 'inline-block' : 'none';
        
        // Bloqueo y desbloqueo estricto de elementos interactivos del DOM
        document.querySelectorAll('#documentTableBody input, #documentTableBody select').forEach(i => i.disabled = !editMode);
        document.querySelectorAll('.custom-file-upload').forEach(lbl => {
            if(!editMode) lbl.classList.add('disabled-label');
            else lbl.classList.remove('disabled-label');
        });
    }

    function addRow(datos = null) {
        const tbody = document.getElementById('documentTableBody');
        const row = document.createElement('tr');
        
        // Generar un ID incremental o usar el histórico guardado
        const d = datos || { id: Date.now() + Math.floor(Math.random() * 1000), desc: '', fecha: '', estado: '', fileName: '', src: '' };
        const rowId = d.id;

        // Conservar archivo si viene del Storage
        if(d.src) {
            archivosCargadosMemoria[rowId] = { src: d.src, name: d.fileName };
        }

        const estadoInput = editMode ? '' : 'disabled';
        const claseLabel = editMode ? '' : 'disabled-label';

        row.innerHTML = `
            <td><input type="checkbox" class="row-chk" ${estadoInput}></td>
            <td><input type="text" class="field-input v-desc" placeholder="Ej: Póliza de Seguro" value="${d.desc}" ${estadoInput}></td>
            <td><input type="date" class="field-input v-fecha" value="${d.fecha}" ${estadoInput}></td>
            <td><input type="text" class="field-input v-estado" placeholder="Vigente / Pendiente" value="${d.estado}" ${estadoInput}></td>
            <td>
                <label class="custom-file-upload ${claseLabel}">
                    <input type="file" accept="image/*, .pdf" onchange="handleFile(this, ${rowId})" ${estadoInput}>
                    📂 Cargar
                </label>
                <span id="name-${rowId}" style="font-size: 0.75rem; margin-left: 8px; color: #ffd700; font-weight: bold;">${d.fileName || ''}</span>
            </td>
            <td>
                <button class="btn btn-view" id="view-${rowId}" onclick="verArchivo(${rowId})" style="display: ${d.src ? 'inline-block' : 'none'}">👁️ Ver</button>
            </td>
        `;
        row.dataset.id = rowId;
        tbody.appendChild(row);
    }

    function handleFile(input, id) {
        const btnOjo = document.getElementById(`view-${id}`);
        if(input.files && input.files[0]) {
            const file = input.files[0];
            document.getElementById(`name-${id}`).innerText = file.name;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                // Almacenamiento Base64 persistente indestructible para Microsoft Edge
                archivosCargadosMemoria[id] = { src: e.target.result, name: file.name };
                btnOjo.style.display = 'inline-block';
            };
            reader.readAsDataURL(file);
        }
    }

    function verArchivo(id) {
        if(archivosCargadosMemoria[id]) {
            const fileData = archivosCargadosMemoria[id];
            const win = window.open("");
            if (fileData.src.includes('data:image/')) {
                win.document.write(`<body style="margin:0; background:#111; display:flex; justify-content:center; align-items:center; height:100vh;"><img src="${fileData.src}" style="max-width:100%; max-height:100%;"></body>`);
            } else {
                win.document.write(`<body style="margin:0; height:100vh;"><iframe src="${fileData.src}" frameborder="0" style="width:100%; height:100%;" allowfullscreen></iframe></body>`);
            }
        }
    }

    function guardarYFinalizarDocumentos() {
        const listaDocumentos = [];
        document.querySelectorAll('#documentTableBody tr').forEach(row => {
            const rowId = row.dataset.id;
            const desc = row.querySelector('.v-desc').value.trim();
            if(desc !== "") {
                listaDocumentos.push({
                    id: rowId,
                    desc: desc,
                    fecha: row.querySelector('.v-fecha').value,
                    estado: row.querySelector('.v-estado').value,
                    fileName: document.getElementById(`name-${rowId}`).innerText,
                    src: archivosCargadosMemoria[rowId] ? archivosCargadosMemoria[rowId].src : ''
                });
            }
        });

        const key = 'sigiv_documentos_' + obraActual.replace(/\s+/g, '_');
        localStorage.setItem(key, JSON.stringify(listaDocumentos));
        toggleEdit();
        alert("💾 Base de datos documental actualizada correctamente en S.I.G.I.V.");
    }

    function cargarDocumentosDesdeStorage() {
        const tbody = document.getElementById('documentTableBody');
        tbody.innerHTML = '';
        const key = 'sigiv_documentos_' + obraActual.replace(/\s+/g, '_');
        const guardados = JSON.parse(localStorage.getItem(key));

        if (guardados && guardados.length > 0) {
            guardados.forEach(doc => addRow(doc));
        } else {
            addRow(); // Una fila vacía inicial reglamentaria
        }
    }

    function deleteRows() {
        if(!editMode) return;
        const checks = document.querySelectorAll('.row-chk:checked');
        if(checks.length === 0) return alert("Seleccione los documentos a eliminar.");
        
        if(confirm("¿Seguro que desea eliminar los registros seleccionados?")) {
            checks.forEach(c => {
                const row = c.closest('tr');
                delete archivosCargadosMemoria[row.dataset.id];
                row.remove();
            });
        }
    }

    function safeBack() {
        const destino = 'administracion_obra.html';
        if (editMode) {
            if (confirm("⚠️ El modo EDICIÓN está activo. ¿Deseas salir sin guardar los cambios?")) {
                window.location.href = destino;
            }
        } else {
            window.location.href = destino;
        }
    }
</script>

</body>
</html>
