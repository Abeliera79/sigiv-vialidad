<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Acceso</title>
    <style>
        /* Configuracion General */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Imagen de Fondo */
        .background {
            background-image: url('login.jpg'); 
            background-size: cover;
            background-position: center;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Contenedor Efecto Vidrio (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo Central */
        .logo {
            width: 100%; /* Ajustado de 180% para evitar desbordamiento */
            max-width: 350px; 
            height: auto;
            margin-bottom: 40px; /* Ajustado para mejor balance visual */
            filter: drop-shadow(0px 5px 15px rgba(0,0,0,0.5));
        }

        /* Botón de Acceso Inferior */
        .btn-acceso {
            background: linear-gradient(180deg, #9da4ad 0%, #5e6671 100%);
            border: 1px solid #ffffff44;
            color: #1a2533;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            width: 100%;
        }

        .btn-acceso:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            filter: brightness(1.1);
        }

        .btn-acceso:active {
            transform: translateY(1px);
        }

        /* Versión al pie */
        .version {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="background">
        
        <div class="glass-panel">
            <!-- Logo -->
            <img src="logo_sigiv_firma.png" alt="SIGIV Logo" class="logo">

            <!-- Boton de Acceso -->
            <button class="btn-acceso" onclick="window.location.href='login.html'">
                ACCESO AL SISTEMA
            </button>

            <div class="version">v1.0 (2026) 📡</div>
        </div>

    </div>

</body>
</html>
