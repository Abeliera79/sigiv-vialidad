<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Menú Principal</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
        }

        .background {
            /* Usamos la nueva imagen de fondo */
            background-image: url('fondo_menu_principal.jpg');
            background-size: cover; 
            background-position: center; 
            height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.6); /* Un poco más oscuro para resaltar sobre la obra */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 50px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        h1 {
            color: #ffd700;
            font-weight: 800;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .obra-tag {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* Contenedor de Botones */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .btn-menu {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-menu:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffd700;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            color: #ffd700;
        }

        /* Botón Volver con estilo diferente */
        .btn-volver {
            margin-top: 20px;
            background: transparent;
            border: none;
            color: #ff6b6b;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .credits {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="background">
    <div class="glass-panel">
        <h1>Menú Principal</h1>
        <div id="obra-activa" class="obra-tag">Obra: Cargando...</div>

        <div class="menu-grid">
            <button class="btn-menu" onclick="window.location.href='control_obra.html'">
                🚧 Control de Obra
            </button>
            
            <button class="btn-menu" onclick="window.location.href='administracion_obra.html'">
                📁 Administración de Obra
            </button>
            
            <button class="btn-menu" onclick="window.location.href='items_computos.html'">
                📊 Ítem / Cómputos
            </button>
        </div>

        <button class="btn-volver" onclick="window.location.href='obras.html'">
            ⬅ Volver a Selección de Obra
        </button>
    </div>

    <div class="credits">S.I.G.I.V. - Gestión Vial</div>
</div>

<script>
    window.onload = function() {
        // Recuperamos el nombre de la obra que guardamos en la pantalla anterior
        const obraActual = sessionStorage.getItem('obraActual');
        
        if (obraActual) {
            document.getElementById('obra-activa').innerText = `Obra: ${obraActual}`;
        } else {
            // Si por alguna razón no hay obra seleccionada, vuelve atrás
            window.location.href = 'obras.html';
        }
    };
</script>

</body>
</html>
