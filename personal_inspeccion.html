<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Personal Inspección D.P.V.</title>
    <style>
        :root {
            --vialidad-blue: #005596; /* Azul institucional DPV */
            --ocre-light: #b08d5c;
            --ocre-dark: #6e5535;
            --glass-bg: rgba(10, 20, 35, 0.9);
            --border-gold: rgba(176, 141, 92, 0.4);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e14; /* Fondo oscuro base */
            /* Se aplica un degradado sutil con el azul institucional */
            background: radial-gradient(circle at center, #1a2a3a 0%, #050a10 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .menu-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold);
            border-radius: 30px;
            padding: 50px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            position: relative;
        }

        .logo-vialidad {
            width: 140px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .header-title {
            margin-bottom: 35px;
        }

        h1 {
            color: var(--ocre-light);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        h2 {
            color: #fff;
            font-size: 1rem;
            font-weight: 300;
            margin-top: 5px;
            opacity: 0.8;
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-menu {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-gold);
            color: white;
            padding: 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: block;
        }

        .btn-menu:hover {
            background: var(--vialidad-blue);
            border-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 85, 150, 0.4);
        }

        .btn-back {
            margin-top: 30px;
            background: transparent;
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 12px;
            font-size: 0.85rem;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #ff6b6b;
            color: white;
        }

        /* Adorno visual superior */
        .top-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 4px;
            background: var(--ocre-light);
            border-radius: 0 0 10px 10px;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <div class="top-line"></div>
        
        <img src="Logo dpv.png" alt="Logo Vialidad" class="logo-vialidad">
        
        <div class="header-title">
            <h1>Inspección D.P.V.</h1>
            <h2>SISTEMA INTEGRAL DE GESTIÓN</h2>
        </div>

        <div class="button-grid">
            <a href="asistencia_inspeccion.html" class="btn-menu">Planilla Asistencia</a>
            <a href="horas_extras_inspeccion.html" class="btn-menu">Planilla Horas Extras</a>
            <a href="viaticos_inspeccion.html" class="btn-menu">Planilla Viáticos</a>
            <a href="francos_inspeccion.html" class="btn-menu">Planilla Francos Compensatorios</a>
        </div>

        <button onclick="window.location.href='administracion_obra.html'" class="btn-back">
            ⬅ VOLVER A ADMINISTRACIÓN
        </button>
    </div>

</body>
</html>
