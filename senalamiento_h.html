<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Señalamiento Horizontal</title>
    <style>
        :root {
            --bronze: #A67C52;
            --glass: rgba(20, 25, 30, 0.95);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: url('fondo_horizontal.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .menu-bar { margin-bottom: 20px; display: flex; gap: 10px; }

        button {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--bronze);
            color: var(--bronze);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }

        button.active { background: #28a745; border-color: #28a745; color: white; } /* Verde para cuando dice GUARDAR */

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }

        th {
            background: rgba(166, 124, 82, 0.8);
            color: white;
            font-size: 0.65rem;
            padding: 10px 2px;
            border: 1px solid var(--border);
        }

        /* ANCHOS CONTROLADOS PARA EVITAR DEFORMACIONES */
        .col-sel { width: 35px; }
        .col-fecha { width: 115px; }
        .col-prog { width: 70px; }
        .col-long { width: 70px; background: rgba(166, 124, 82, 0.1); }
        .col-tipo { width: 110px; }
        .col-det { width: 175px; }
        .col-lin { width: 65px; }
        .col-mat { width: 140px; }
        .col-pin { width: 105px; }
        .col-col { width: 80px; }
        .col-ref { width: 130px; }
        .col-est { width: 95px; }
        .col-img { width: 90px; }

        td { border: 1px solid var(--border); padding: 2px; }
        
        input, select {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: none;
            color: white;
            font-size: 0.72rem;
            padding: 5px 2px;
            box-sizing: border-box;
        }
        
        option { background: #222; color: white; }

        input:disabled, select:disabled { background: transparent; opacity: 0.8; color: #eee; }
        
        .ojito { cursor: pointer; color: var(--bronze); font-size: 1.2rem; display: none; }
        .adjunto-btn { font-size: 0.7rem; color: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div class="menu-bar">
        <button id="btnEditar" onclick="toggleEdicion()">Editar</button>
        <button onclick="agregarFila()">Agregar Fila</button>
        <button onclick="eliminarFilas()">Eliminar</button>
        <button onclick="confirmarVolver()">Volver</button>
    </div>

    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th class="col-sel">Sel.</th>
                    <th class="col-fecha">Fecha</th>
                    <th class="col-prog">Prog. Ini</th>
                    <th class="col-prog">Prog. Fin</th>
                    <th class="col-long">Longitud</th>
                    <th class="col-tipo">Tipo</th>
                    <th class="col-det">Detalle</th>
                    <th class="col-lin">Nº Líneas</th>
                    <th class="col-mat">Material</th>
                    <th class="col-pin">Pintura</th>
                    <th class="col-col">Color</th>
                    <th class="col-ref">Microprisma</th>
                    <th class="col-ref">Reflexión</th>
                    <th class="col-est">Estado</th>
                    <th class="col-img">Imagen</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo"></tbody>
        </table>
    </div>
</div>

<script>
    let editando = false;
    let cambiosSinGuardar = false;
    const imagenesCargadas = {}; 

    window.addEventListener('beforeunload', function (e) {
        if (cambiosSinGuardar) {
            e.preventDefault();
            e.returnValue = ''; 
        }
    });

    function registrarCambio() { cambiosSinGuardar = true; }

    function toggleEdicion() {
        const btn = document.getElementById('btnEditar');
        
        if (editando) {
            // SI ESTABA EDITANDO Y SE PRESIONA, SE EJECUTA EL GUARDADO
            guardarDatosCSV();
            editando = false;
            btn.classList.remove('active');
            btn.innerText = "EDITAR";
        } else {
            // SI NO ESTABA EDITANDO, ACTIVA EL MODO EDICIÓN
            editando = true;
            btn.classList.add('active');
            btn.innerText = "GUARDAR CAMBIOS";
        }

        // Bloquear o desbloquear elementos según corresponda
        document.querySelectorAll('input, select').forEach(el => {
            if(!el.classList.contains('col-long-input')) el.disabled = !editando;
        });

        document.querySelectorAll('.ojito').forEach(o => o.style.display = editando ? 'none' : 'inline-block');
        document.querySelectorAll('.adjunto-btn').forEach(a => a.style.display = editando ? 'inline-block' : 'none');
    }

    function guardarDatosCSV() {
        const filas = document.querySelectorAll('#tablaCuerpo tr');
        if(filas.length === 0) {
            alert("No hay datos para guardar.");
            cambiosSinGuardar = false;
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        // Encabezados del Excel
        csvContent += "Fecha,Prog_Ini,Prog_Fin,Longitud,Tipo,Detalle,N_Lineas,Material,Pintura,Color,Microprisma,Reflexion,Estado\n";

        filas.forEach(fila => {
            const inputs = fila.querySelectorAll('input, select');
            // Recolectamos los valores omitiendo el checkbox (0) y el archivo de imagen (último)
            const fecha = inputs[1].value;
            const ini = inputs[2].value;
            const fin = inputs[3].value;
            const long = inputs[4].value;
            const tipo = inputs[5].value;
            const det = inputs[6].value;
            const lin = inputs[7].value;
            const mat = inputs[8].value;
            const pin = inputs[9].value;
            const col = inputs[10].value;
            const ref1 = inputs[11].value;
            const ref2 = inputs[12].value;
            const est = inputs[13].value;

            csvContent += `"${fecha}","${ini}","${fin}","${long}","${tipo}","${det}","${lin}","${mat}","${pin}","${col}","${ref1}","${ref2}","${est}"\n`;
        });

        // Generar descarga automática
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "registro_señalamiento_horizontal.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        cambiosSinGuardar = false; // Ya está salvado
        alert("¡Datos guardados y descargados exitosamente como reporte Excel/CSV!");
    }

    function calcularLongitud(id) {
        const ini = parseFloat(document.getElementById('ini-' + id).value) || 0;
        const fin = parseFloat(document.getElementById('fin-' + id).value) || 0;
        document.getElementById('long-' + id).value = (fin - ini).toFixed(2);
        registrarCambio();
    }

    function previsualizarImagen(input, id) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) { 
                imagenesCargadas[id] = e.target.result; 
                registrarCambio();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function verImagen(id) {
        if (imagenesCargadas[id]) {
            const win = window.open();
            win.document.write('<img src="' + imagenesCargadas[id] + '" style="max-width:100%">');
        } else {
            alert("No hay imagen adjunta.");
        }
    }

    function agregarFila() {
        if(!editando) return alert("Habilite 'EDITAR' primero.");
        const id = Date.now();
        const fila = document.createElement('tr');
        
        fila.innerHTML = '=== TR INICIO ===' +
            '<td class="col-sel"><input type="checkbox" class="sel-check"></td>' +
            '<td class="col-fecha"><input type="date" onchange="registrarCambio()"></td>' +
            '<td class="col-prog"><input type="number" id="ini-' + id + '" oninput="calcularLongitud(' + id + ')" placeholder="0"></td>' +
            '<td class="col-prog"><input type="number" id="fin-' + id + '" oninput="calcularLongitud(' + id + ')" placeholder="0"></td>' +
            '<td class="col-long"><input type="text" id="long-' + id + '" class="col-long-input" readonly value="0.00"></td>' +
            '<td class="col-tipo"><select onchange="registrarCambio()">' +
                '<option>Longuitudinal</option><option>Transversal</option><option>Especial</option>' +
            '</select></td>' +
            '<td class="col-det"><select onchange="registrarCambio()">' +
                '<option>Continua</option><option>Discontinua</option><option>Aux. Red. Veloc.</option>' +
                '<option>Detencion</option><option>Senda Peatonal</option><option>Senda Ciclista</option>' +
                '<option>Pare</option><option>P(Parada Autotransporte)</option><option>Isleta</option>' +
                '<option>Estacionamiento</option><option>Niebla</option><option>Sep. Transito</option>' +
                '<option>Bandas Opticas Sonoras</option>' +
            '</select></td>' +
            '<td class="col-lin"><select onchange="registrarCambio()"><option>Simple</option><option>Doble</option></select></td>' +
            '<td class="col-mat"><select onchange="registrarCambio()">' +
                '<option>1 componente</option><option>2 o mas comp.</option>' +
                '<option>Caliente In-Situ</option><option>Caliente premoldeado</option>' +
            '</select></td>' +
            '<td class="col-pin"><select onchange="registrarCambio()"><option>Base de agua</option><option>Termoplastica</option></select></td>' +
            '<td class="col-col"><select onchange="registrarCambio()">' +
                '<option>Blanco</option><option>Amarillo</option><option>Rojo</option><option>Verde</option><option>Azul</option><option>Negro</option>' +
            '</select></td>' +
            '<td class="col-ref"><select onchange="registrarCambio()"><option>Vinila Reflejante</option><option>Microesfera</option></select></td>' +
            '<td class="col-ref"><select onchange="registrarCambio()">' +
                '<option>Reflexion Optima</option><option>Reflexion Difusa</option><option>Reflexion Tipo Espejo</option>' +
            '</select></td>' +
            '<td class="col-est"><select onchange="registrarCambio()"><option>C.E.T</option><option>No C.E.T</option><option>Observacion</option></select></td>' +
            '<td class="col-img" style="text-align:center">' +
                '<span class="ojito" onclick="verImagen(' + id + ')">👁️</span>' +
                '<input type="file" class="adjunto-btn" onchange="previsualizarImagen(this, ' + id + ')">' +
            '</td>';
            
        fila.innerHTML = fila.innerHTML.replace('=== TR INICIO ===', '');
        document.getElementById('tablaCuerpo').appendChild(fila);
        registrarCambio();
    }

    function eliminarFilas() {
        if(!editando) return alert("Habilite 'EDITAR' primero.");
        document.querySelectorAll('.sel-check:checked').forEach(c => c.closest('tr').remove());
        registrarCambio();
    }

    function confirmarVolver() {
        if (cambiosSinGuardar) {
            if (confirm("¿Desea salir? Los cambios no guardados se perderán.")) {
                window.location.href = 'control_obra.html'; 
            }
        } else {
            window.location.href = 'control_obra.html';
        }
    }
</script>
</body>
</html>
