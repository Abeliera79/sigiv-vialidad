<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Señalamiento Vertical</title>
    <style>
        :root {
            --ocre-light: #b08d5c;
            --ocre-gold: #ffd700;
            --glass-bg: rgba(10, 15, 20, 0.9);
            --border-gold: rgba(176, 141, 92, 0.4);
            --danger: #c0392b;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #050a10 url('fondo_vertical.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #e0e0e0;
            overflow: hidden;
        }

        .background-overlay {
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .main-container {
            width: 97%; max-width: 1450px; height: 92vh;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-gold);
            border-radius: 20px; padding: 25px;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .header-sigiv {
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 2px solid var(--ocre-light);
            padding-bottom: 10px; margin-bottom: 20px;
        }

        h2 { color: var(--ocre-gold); text-transform: uppercase; letter-spacing: 3px; margin: 0; font-size: 1.6rem; }

        .control-panel { display: flex; gap: 12px; margin-bottom: 20px; }

        .btn {
            padding: 10px 18px; border-radius: 8px; border: none;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
            font-size: 0.75rem; transition: 0.3s; color: white;
        }
        .btn-edit { background: var(--ocre-light); color: #000; }
        .btn-edit.active { background: var(--danger); color: white; box-shadow: 0 0 15px var(--danger); }
        .btn-add { background: #2980b9; }

        .table-wrapper {
            flex-grow: 1; overflow-y: auto;
            border-radius: 10px; background: rgba(0,0,0,0.2);
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th {
            background: rgba(176, 141, 92, 0.2); color: var(--ocre-gold);
            padding: 12px; text-align: center; position: sticky; top: 0;
            border-bottom: 2px solid var(--ocre-light); z-index: 5;
            text-transform: uppercase; font-size: 0.65rem;
        }

        td { padding: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }

        .field-input {
            background: transparent; border: 1px solid transparent;
            color: white; width: 95%; padding: 4px; text-align: center;
            border-radius: 4px; outline: none; font-size: 0.8rem;
        }
        .edit-mode .field-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(176,141,92,0.3); }

        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
        }
        .modal-content {
            background: #1a1c20; margin: 5% auto; padding: 30px; width: 80%;
            border: 2px solid var(--ocre-gold); border-radius: 20px; color: white;
        }

        .btn-back {
            background: transparent; border: 1px solid #ff6b6b; color: #ff6b6b;
            padding: 10px 25px; border-radius: 10px; font-weight: bold; cursor: pointer;
        }

        @media print {
            .control-panel, .btn-back, th:first-child, td:first-child { display: none !important; }
            .main-container { background: white; color: black; border: none; width: 100%; height: auto; }
            h2, th { color: black; border-bottom: 2px solid black; }
            .field-input { color: black !important; }
        }
    </style>
</head>
<body>

<div class="background-overlay">
    <div class="main-container" id="mainWrapper">
        <div class="header-sigiv">
            <div>
                <h2>Inspección Señalamiento Vertical</h2>
                <div style="font-size: 0.7rem; color: #aaa; margin-top: 4px;">S.I.G.I.V. | ÁREA TÉCNICA</div>
            </div>
            <div id="txtModo" style="font-size: 0.8rem; font-weight: bold; color: var(--ocre-light);">MODO LECTURA</div>
        </div>

        <div class="control-panel">
            <button class="btn btn-edit" id="btnModo" onclick="toggleEdit()">Modo Edición</button>
            <button class="btn btn-add" id="btnAdd" style="display:none" onclick="agregarFila()">+ Agregar Señal</button>
            <button class="btn" style="background:transparent; border:1px solid var(--ocre-gold); color:var(--ocre-gold)" onclick="abrirGuia()">📙 Catálogo IRAM</button>
            <button class="btn" style="background:#444; margin-left: auto;" onclick="window.print()">Exportar PDF</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th width="40">Sel.</th>
                        <th width="110">Fecha</th>
                        <th width="100">Cód. IRAM</th>
                        <th width="150">Tipo Señal</th>
                        <th>Descripción / Leyenda</th>
                        <th width="130">Ubicación</th>
                        <th width="130">Estado</th>
                    </tr>
                </thead>
                <tbody id="listaCuerpo"></tbody>
            </table>
        </div>

        <div class="footer" style="margin-top: 20px;">
            <button class="btn-back" onclick="volver()">⬅ VOLVER AL PANEL DE OBRA</button>
        </div>
    </div>
</div>

<div id="guiaModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:20px;">
            <h2 style="color:var(--ocre-gold); margin:0;">MANUAL DE SEÑALAMIENTO VIAL</h2>
            <button class="btn" style="background:var(--danger)" onclick="cerrarGuia()">CERRAR (X)</button>
        </div>
        <div style="background: rgba(255,255,255,0.05); padding: 40px; border-radius: 15px; text-align: center;">
            <p style="font-size: 1.2rem; color: #ccc;">[ Visualización del Atlas de Señales IRAM ]</p>
        </div>
    </div>
</div>

<script>
    let editando = false;
    const catalogo = {
        "R.1": { t: "PROHIBICIÓN", d: "NO AVANZAR" },
        "R.27": { t: "PRIORIDAD", d: "PARE" },
        "R.15": { t: "RESTRICCIÓN", d: "VELOCIDAD MÁXIMA" },
        "P.4": { t: "PREVENTIVA", d: "CURVA CERRADA" },
        "I.2": { t: "INFORMATIVA", d: "RUTA NACIONAL" }
    };

    function toggleEdit() {
        editando = !editando;
        const wrapper = document.getElementById('mainWrapper');
        const btn = document.getElementById('btnModo');
        const btnAdd = document.getElementById('btnAdd');
        const txt = document.getElementById('txtModo');
        
        wrapper.classList.toggle('edit-mode');
        btn.innerText = editando ? "Guardar Cambios" : "Modo Edición";
        btn.classList.toggle('active');
        btnAdd.style.display = editando ? "inline-block" : "none";
        txt.innerText = editando ? "EDICIÓN ACTIVA" : "MODO LECTURA";
        txt.style.color = editando ? "#f87171" : "var(--ocre-light)";

        document.querySelectorAll('.field-input, .ch-row').forEach(i => i.disabled = !editando);
    }

    function agregarFila() {
        const tbody = document.getElementById('listaCuerpo');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="checkbox" class="ch-row"></td>
            <td><input type="date" class="field-input" value="${new Date().toISOString().split('T')[0]}"></td>
            <td><input type="text" class="field-input" placeholder="Ej: R.27" oninput="autoFill(this)"></td>
            <td><input type="text" class="field-input v-tipo" readonly style="color:var(--ocre-gold)"></td>
            <td><input type="text" class="field-input v-desc" placeholder="Descripción..."></td>
            <td><select class="field-input"><option>DER</option><option>IZQ</option><option>CANTERO</option></select></td>
            <td><select class="field-input"><option>NUEVO</option><option>B. ESTADO</option><option>DETERIORADO</option></select></td>
        `;
        tbody.appendChild(tr);
    }

    function autoFill(input) {
        const cod = input.value.toUpperCase().trim();
        const fila = input.closest('tr');
        if(catalogo[cod]) {
            fila.querySelector('.v-tipo').value = catalogo[cod].t;
            fila.querySelector('.v-desc').value = catalogo[cod].d;
        }
    }

    function abrirGuia() { document.getElementById('guiaModal').style.display = 'block'; }
    function cerrarGuia() { document.getElementById('guiaModal').style.display = 'none'; }
    
    function volver() {
        if(editando) {
            if(!confirm("Hay cambios sin guardar. ¿Desea salir?")) return;
        }
        window.location.href = 'control_obra.html';
    }

    window.onload = () => {
        agregarFila();
        toggleEdit(); toggleEdit();
    };
</script>
</body>
</html>
