<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>S.I.G.I.V. - Señalamiento Vertical</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('fondo_vertical.jpg') !important;
            background-size: cover;
            background-attachment: fixed;
        }
        
        .planilla-container {
            max-width: 98%;
            margin: 10px auto;
            background: rgba(15, 23, 42, 0.4); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--bronze-dark);
            border-radius: 8px;
            padding: 15px;
            position: relative;
            min-height: 88vh;
            color: white;
        }

        .btn-exit-x {
            position: absolute; top: 15px; right: 15px;
            background: rgba(153, 27, 27, 0.8); color: white;
            border: 1px solid #f87171; width: 35px; height: 35px;
            border-radius: 4px; cursor: pointer; font-size: 1.5rem;
            z-index: 100; display: flex; align-items: center; justify-content: center;
        }

        .guia-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            overflow: auto;
        }

        .guia-content {
            margin: 2% auto;
            padding: 20px;
            width: 80%;
            max-width: 900px;
            background: #1e293b;
            border: 2px solid var(--bronze);
            border-radius: 10px;
            text-align: center;
        }

        .guia-img { width: 100%; height: auto; border-radius: 5px; }

        .btn-cerrar-guia {
            background: var(--bronze); color: black;
            padding: 10px 20px; border: none; border-radius: 5px;
            cursor: pointer; font-weight: bold; margin-bottom: 10px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        
        th { 
            background: rgba(166, 124, 82, 0.35); color: var(--bronze); 
            padding: 8px 2px; font-size: 0.65rem; text-transform: uppercase;
            border: 1px solid rgba(166, 124, 82, 0.4);
        }

        .col-sel { width: 35px; }
        .col-fecha { width: 110px; }
        .col-cod { width: 90px; }
        .col-tipo { width: 280px; }
        .col-desc { width: auto; }
        .col-lado { width: 130px; }
        .col-estado { width: 150px; }
        .col-user-img { width: 140px; }

        td { border: 1px solid rgba(255,255,255,0.1); padding: 5px; text-align: center; font-size: 0.8rem; }

        input, select {
            background: rgba(0,0,0,0.5); border: 1px solid #475569;
            color: white; width: 100%; padding: 6px;
            border-radius: 3px; font-size: 0.75rem;
        }

        input:disabled, select:disabled {
            background: transparent !important; border: none !important; color: #f1f5f9 !important; cursor: default; appearance: none;
        }

        select option { background-color: white !important; color: black !important; }

        .btn-controles { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        
        .btn-entrar {
            background: #000; border: 1px solid var(--bronze); color: var(--bronze); 
            padding: 10px 20px; border-radius: 5px; cursor: pointer; 
            font-weight: bold; text-transform: uppercase; transition: 0.3s; font-size: 0.75rem;
        }
        .btn-entrar:hover { background: var(--bronze); color: black; }
        .btn-entrar.active { background: #475569; color: white; border-color: #475569; }

        .btn-agregar { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: #10b981; }
        .btn-agregar:hover { background: #10b981; color: white; }
        .btn-eliminar { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: #ef4444; }
        .btn-eliminar:hover { background: #ef4444; color: white; }

        .btn-ojo {
            background: rgba(166, 124, 82, 0.2); border: 1px solid var(--bronze);
            color: var(--bronze); cursor: pointer; padding: 2px 8px;
            border-radius: 4px; display: none; font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div id="modalGuia" class="guia-modal">
    <div class="guia-content">
        <button class="btn-cerrar-guia" onclick="cerrarGuia()">CERRAR GUÍA (X)</button>
        <img src="guia_señalamiento.jpg" alt="Guía de Señalamiento" class="guia-img">
    </div>
</div>

<div class="planilla-container">
    <button class="btn-exit-x" onclick="salirSistema()">×</button>
    
    <div style="border-bottom: 2px solid var(--bronze); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end;">
        <div>
            <h2 style="color: var(--bronze); margin: 0; font-family: 'Playfair Display', serif;">INSPECCIÓN SEÑALAMIENTO VERTICAL</h2>
            <p style="color: #cbd5e1; font-size: 0.65rem; margin: 3px 0 8px 0;">S.I.G.I.V. - GESTIÓN DE ACTIVOS VIALES</p>
        </div>
        <div style="color: var(--bronze); font-size: 0.7rem; margin-bottom: 8px;">
            MODO: <span id="indicadorModo" style="font-weight: bold;">LECTURA</span>
        </div>
    </div>

    <div class="btn-controles">
        <button id="btnEditar" class="btn-entrar" onclick="toggleEditar()">EDITAR</button>
        <button id="btnAgregar" class="btn-entrar btn-agregar" style="display: none;" onclick="agregarFila()">AGREGAR FILA</button>
        <button id="btnEliminar" class="btn-entrar btn-eliminar" style="display: none;" onclick="eliminarFilas()">ELIMINAR</button>
        <button class="btn-entrar" style="background: rgba(30, 41, 59, 0.8);" onclick="imprimirPlanilla()">IMPRIMIR</button>
        <button class="btn-entrar" style="background: #065f46; border-color: #34d399;" onclick="abrirGuia()">📙 GUÍA DE CARTELERÍA</button>
    </div>

    <table id="tablaVertical">
        <thead>
            <tr>
                <th class="col-sel">Sel.</th>
                <th class="col-fecha">Fecha</th>
                <th class="col-cod">Código</th>
                <th class="col-tipo">Tipo</th>
                <th class="col-desc">Descripción</th>
                <th class="col-lado">Lado</th>
                <th class="col-estado">Estado</th>
                <th class="col-user-img">Inspección</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>

    <div style="margin-top: 20px;">
        <button class="btn-entrar" style="width: 140px; background: transparent; border: 1px solid #64748b; height: 35px;" onclick="confirmarVolver()">VOLVER</button>
    </div>
</div>

    let modoEdicion = false;
    let datosModificados = false;
    let archivosCargados = {};
    let idFila = 0;

    function toggleEditar() {
        modoEdicion = !modoEdicion;
        const btn = document.getElementById('btnEditar');
        const btnAdd = document.getElementById('btnAgregar');
        const btnDel = document.getElementById('btnEliminar');
        const ind = document.getElementById('indicadorModo');
        const inputs = document.querySelectorAll('#cuerpoTabla input, #cuerpoTabla select');

        if(modoEdicion) {
            btn.innerText = "GUARDAR";
            ind.innerText = "EDICIÓN ACTIVA";
            ind.style.color = "#f87171";
            btnAdd.style.display = "inline-block";
            btnDel.style.display = "inline-block";
            inputs.forEach(i => i.disabled = false);
        } else {
            btn.innerText = "EDITAR";
            ind.innerText = "LECTURA";
            ind.style.color = "var(--bronze)";
            btnAdd.style.display = "none";
            btnDel.style.display = "none";
            inputs.forEach(i => i.disabled = true);
            datosModificados = false;
        }
    }

    function agregarFila() {
        idFila++;
        const tbody = document.querySelector('#tablaVertical tbody');
        const tr = document.createElement('tr');
        tr.dataset.id = idFila;
        tr.innerHTML = `
            <td><input type="checkbox" class="row-sel" style="width:18px; height:18px;"></td>
            <td><input type="date" value="${new Date().toISOString().split('T')[0]}" onchange="marcar()"></td>
            <td><input type="text" class="v-cod" placeholder="R.27" oninput="validarCodigo(this)"></td>
            <td><input type="text" class="v-tipo" readonly style="color:var(--bronze); font-weight:bold;"></td>
            <td><input type="text" class="v-desc" readonly style="text-align:left"></td>
            <td>
                <select onchange="marcar()">
                    <option>DERECHA</option>
                    <option>IZQUIERDA</option>
                    <option>S/CANTERO</option>
                    <option>S/ISLETA</option>
                </select>
            </td>
            <td>
                <select onchange="marcar()">
                    <option value="Nuevo">Nuevo</option>
                    <option value="Buen estado">Buen estado</option>
                    <option value="Mal estado">Mal estado</option>
                    <option value="No se encuentra">No se encuentra</option>
                </select>
            </td>
            <td>
                <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
                    <button class="ojo" onclick="verDocumento(${idFila})">👁️ Ver</button>
                    <input type="file" accept="image/*, .pdf" style="font-size:0.65rem; width:110px;" onchange="cargarArchivo(this, ${idFila})">
                </div>
            </td>
        `;
        tbody.appendChild(tr);
        marcar();
        tr.querySelectorAll('input, select').forEach(i => i.disabled = !modoEdicion);
    }

    function marcar() { if(modoEdicion) datosModificados = true; }

    function validarCodigo(el) {
        const cod = el.value.toUpperCase().trim();
        const fila = el.closest('tr');
        if(catalogoIRAM[cod]) {
            fila.querySelector('.v-tipo').value = catalogoIRAM[cod].t;
            fila.querySelector('.v-desc').value = catalogoIRAM[cod].d;
        } else {
            fila.querySelector('.v-tipo').value = "";
            fila.querySelector('.v-desc').value = "";
        }
        marcar();
    }

    function cargarArchivo(input, id) {
        const btnOjo = input.closest('td').querySelector('.ojo');
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) { 
                archivosCargados[id] = { src: e.target.result, name: input.files[0].name, type: input.files[0].type }; 
                btnOjo.style.display = "inline-block";
                marcar();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function verDocumento(id) {
        if (archivosCargados[id]) {
            const fileData = archivosCargados[id];
            const win = window.open("");
            if (fileData.type.startsWith('image/')) {
                win.document.write(`<body style="margin:0; background:#111; display:flex; justify-content:center; align-items:center; height:100vh;"><img src="${fileData.src}" style="max-width:100%; max-height:100%;"></body>`);
            } else {
                win.document.write(`<body style="margin:0; height:100vh;"><iframe src="${fileData.src}" frameborder="0" style="width:100%; height:100%;" allowfullscreen></iframe></body>`);
            }
        }
    }

    function eliminarFilas() {
        if(!modoEdicion) return;
        const sel = document.querySelectorAll('.row-sel:checked');
        if(sel.length === 0) return alert("Seleccione registros.");
        if(confirm(`¿Eliminar los ${sel.length} registros seleccionados?`)) {
            sel.forEach(cb => {
                const id = cb.closest('tr').dataset.id;
                delete archivosCargados[id];
                cb.closest('tr').remove();
            });
            datosModificados = true;
        }
    }

    function salirSistema() { if(confirm("¿Desea salir del sistema S.I.G.I.V.?")) window.location.href = 'index.html'; }
    function imprimirPlanilla() { window.print(); }

    function confirmarVolver() {
        if(modoEdicion && datosModificados) {
            if(!confirm("Tiene modificaciones activas sin guardar. ¿Desea regresar de todos modos?")) return;
        }
        window.location.href = 'control_obra.html';
    }

    window.onload = () => { agregarFila(); };
</script>
