<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Señalamiento Vertical</title>
    <style>
        :root {
            --bronze: #d4a373;
            --bronze-dark: #a67c52;
            --slate: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --danger: #ef4444;
            --success: #10b981;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #020617 url('fondo_vertical.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f8fafc;
            overflow: hidden;
        }

        .background-overlay {
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.4);
        }

        .planilla-container {
            width: 97%; max-width: 1450px; height: 92vh;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--bronze-dark);
            border-radius: 12px; padding: 25px;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            box-sizing: border-box;
            position: relative;
        }

        .header-sigiv {
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 2px solid var(--bronze-dark);
            padding-bottom: 10px; margin-bottom: 20px;
        }

        h2 { color: var(--bronze); text-transform: uppercase; letter-spacing: 2px; margin: 0; font-size: 1.6rem; }

        .control-panel { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }

        .btn {
            background: rgba(0,0,0,0.5); border: 1px solid var(--bronze); color: var(--bronze);
            padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; 
            text-transform: uppercase; font-size: 0.75rem; transition: 0.3s;
        }
        .btn:hover { background: var(--bronze); color: black; }
        
        .btn-edit.active { background: var(--danger); color: white; border-color: var(--danger); }
        
        .btn-add { background: rgba(16, 185, 129, 0.2); color: var(--success); border-color: var(--success); }
        .btn-add:hover { background: var(--success); color: white; }

        .btn-delete { background: rgba(239, 68, 68, 0.2); color: var(--danger); border-color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }

        .table-wrapper {
            flex-grow: 1; overflow-y: auto;
            border-radius: 8px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; table-layout: fixed; }
        th {
            background: rgba(212, 163, 115, 0.15); color: var(--bronze);
            padding: 12px; text-align: center; position: sticky; top: 0;
            border-bottom: 2px solid var(--bronze-dark); z-index: 5;
            text-transform: uppercase; font-size: 0.75rem;
        }

        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }

        .field-input, select {
            background: transparent; border: 1px solid transparent;
            color: white; width: 90%; padding: 5px; text-align: center;
            border-radius: 4px; outline: none; font-size: 0.85rem; transition: 0.2s;
        }
        .edit-mode .field-input, .edit-mode select { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(214, 163, 115, 0.3); 
        }
        .edit-mode .field-input:focus, .edit-mode select:focus {
            border-color: var(--bronze); background: rgba(0,0,0,0.4);
        }

        /* Corrección texto negro sobre fondo blanco nativo de selects */
        select option {
            background-color: white !important;
            color: black !important;
        }

        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px);
        }
        .modal-content {
            background: var(--slate); margin: 3% auto; padding: 25px; width: 75%; max-width: 900px;
            border: 1px solid var(--bronze); border-radius: 12px; color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .guia-img-container {
            width: 100%; height: 60vh; overflow-y: auto; margin-top: 15px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; background: #000;
        }
        .guia-img { width: 100%; height: auto; display: block; }

        .btn-back {
            background: transparent; border: 1px solid #ef4444; color: #ef4444;
            padding: 10px 22px; border-radius: 6px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; font-size: 0.8rem; transition: 0.3s;
        }
        .btn-back:hover { background: #ef4444; color: white; }

        @media print {
            .control-panel, .btn-back, th:first-child, td:first-child { display: none !important; }
            .planilla-container { background: white; color: black; border: none; width: 100%; height: auto; }
            h2, th { color: black; border-bottom: 2px solid black; }
            .field-input, select { color: black !important; }
        }
    </style>
</head>
<body>

<div class="background-overlay">
    <div class="planilla-container" id="mainWrapper">
        <div class="header-sigiv">
            <div>
                <h2>Inspección Señalamiento Vertical</h2>
                <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 4px;">S.I.G.I.V. | ÁREA TÉCNICA</div>
            </div>
            <div id="txtModo" style="font-size: 0.85rem; font-weight: bold; color: var(--bronze);">MODO LECTURA</div>
        </div>

        <div class="control-panel">
            <button class="btn btn-edit" id="btnModo" onclick="toggleEdit()">Modo Edición</button>
            <button class="btn btn-add" id="btnAdd" style="display:none" onclick="agregarFila()">+ Agregar Señal</button>
            <button class="btn btn-delete" id="btnDelete" style="display:none" onclick="eliminarFilas()">🗑️ Eliminar Registro</button>
            <button class="btn" style="border-color: #fbbf24; color: #fbbf24;" onclick="abrirGuia()">📙 Guía de Carteleria</button>
            <button class="btn" style="margin-left: auto;" onclick="window.print()">Exportar PDF</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th width="50">Sel.</th>
                        <th width="130">Fecha</th>
                        <th width="110">Cód. IRAM</th>
                        <th width="160">Tipo Señal</th>
                        <th>Descripción / Leyenda</th>
                        <th width="140">Ubicación</th>
                        <th width="200">Estado</th>
                    </tr>
                </thead>
                <tbody id="listaCuerpo"></tbody>
            </table>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn-back" onclick="volver()">⬅ VOLVER AL PANEL DE OBRA</button>
        </div>
    </div>
</div>

<div id="guiaModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; align-items:center; border-bottom: 1px solid var(--bronze-dark); padding-bottom: 10px;">
            <h3 style="color:var(--bronze); margin:0; text-transform: uppercase; letter-spacing: 1px;">Manual Oficial de Señalamiento</h3>
            <button class="btn" style="border-color:var(--danger); color:var(--danger);" onclick="cerrarGuia()">CERRAR (X)</button>
        </div>
        <div class="guia-img-container">
            <img src="guia_señalamiento.jpg" alt="Guía de Cartelería IRAM" class="guia-img">
        </div>
    </div>
</div>

<script>
    let editando = false;
    let datosModificados = false;

    const catalogo = {
        "R.1": { t: "PROHIBICIÓN", d: "NO AVANZAR" },
        "R.27": { t: "PRIORIDAD", d: "PARE" },
        "R.15": { t: "RESTRICCIÓN", d: "VELOCIDAD MÁXIMA" },
        "P.4": { t: "PREVENTIVA", d: "CURVA CERRADA" },
        "I.2": { t: "INFORMATIVA", d: "RUTA NACIONAL" }
    };

    function toggleEdit() {
        editando = !editando;
        const wrapper = document.getElementById('mainWrapper');
        const btn = document.getElementById('btnModo');
        const btnAdd = document.getElementById('btnAdd');
        const btnDelete = document.getElementById('btnDelete');
        const txt = document.getElementById('txtModo');
        
        wrapper.classList.toggle('edit-mode');
        btn.innerText = editando ? "Guardar Cambios" : "Modo Edición";
        btn.classList.toggle('active');
        
        btnAdd.style.display = editando ? "inline-block" : "none";
        btnDelete.style.display = editando ? "inline-block" : "none";
        
        txt.innerText = editando ? "EDICIÓN ACTIVA" : "MODO LECTURA";
        txt.style.color = editando ? "var(--danger)" : "var(--bronze)";

        document.querySelectorAll('.field-input, select, .ch-row').forEach(i => i.disabled = !editando);
    }

    function agregarFila() {
        const tbody = document.getElementById('listaCuerpo');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="checkbox" class="ch-row"></td>
            <td><input type="date" class="field-input" value="${new Date().toISOString().split('T')[0]}"></td>
            <td><input type="text" class="field-input" placeholder="Ej: R.27" oninput="autoFill(this)"></td>
            <td><input type="text" class="field-input v-tipo" readonly style="color:var(--bronze); font-weight:bold;"></td>
            <td><input type="text" class="field-input v-desc" placeholder="Descripción de la señal..."></td>
            <td>
                <select>
                    <option>DERECHA</option>
                    <option>IZQUIERDA</option>
                    <option>CANTERO CENTRAL</option>
                </select>
            </td>
            <td>
                <select>
                    <option value="Nuevo">Nuevo</option>
                    <option value="Buen estado">Buen estado</option>
                    <option value="Mal estado">Mal estado</option>
                    <option value="No se encuentra">No se encuentra</option>
                </select>
            </td>
        `;
        tbody.appendChild(tr);
        datosModificados = true;
        if(!editando) {
            tr.querySelectorAll('.field-input, select, .ch-row').forEach(i => i.disabled = true);
        }
    }

    function autoFill(input) {
        const cod = input.value.toUpperCase().trim();
        const fila = input.closest('tr');
        if(catalogo[cod]) {
            fila.querySelector('.v-tipo').value = catalogo[cod].t;
            fila.querySelector('.v-desc').value = catalogo[cod].d;
        }
        datosModificados = true;
    }

    function eliminarFilas() {
        if (!editando) return; 
        
        const seleccionados = document.querySelectorAll('.ch-row:checked');
        if(seleccionados.length === 0) {
            alert("Por favor, seleccione las filas que desea eliminar usando la casilla 'Sel.'");
            return;
        }
        
        if(confirm(`¿Está seguro que desea eliminar los ${seleccionados.length} registros seleccionados?`)) {
            seleccionados.forEach(cb => cb.closest('tr').remove());
            datosModificados = true;
        }
    }

    function abrirGuia() { document.getElementById('guiaModal').style.display = 'block'; }
    function cerrarGuia() { document.getElementById('guiaModal').style.display = 'none'; }
    
    function volver() {
        if(editando && datosModificados) {
            if(!confirm("Tiene modificaciones sin guardar. ¿Desea regresar al panel de control de todas formas?")) return;
        }
        window.location.href = 'control_obra.html';
    }

    window.onload = () => {
        agregarFila();
    };
</script>
</body>
</html>
