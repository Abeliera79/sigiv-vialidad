<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Control de Nivelación de Cordones</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --cordon-orange: #ff9f43; /* Naranja Vial de Seguridad S.I.G.I.V. */
            --glass: rgba(13, 17, 23, 0.95); 
            --border: rgba(255, 159, 67, 0.15);
            --active-green: #2ecc71;
            --locked-red: #e74c3c;
        }

        body {
            background: #0d1117 url('fondo_cordones.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; 
            padding: 20px;
        }

        .container { max-width: 98%; margin: auto; }

        /* Barra de Herramientas Superior Estilo S.I.G.I.V. */
        .btn-bar { 
            position: sticky; 
            top: 10px; 
            z-index: 1000; 
            display: flex; 
            gap: 12px; 
            justify-content: flex-start; 
            background: rgba(0, 0, 0, 0.85); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-status { 
            padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; 
            border: 1px solid rgba(255,255,255,0.1); text-transform: uppercase; font-size: 0.75rem; color: white;
            transition: all 0.3s ease;
        }
        .locked { background: var(--locked-red); }
        .unlocked { background: var(--active-green); box-shadow: 0 0 15px var(--active-green); color: #000 !important; font-weight: 800; }
        
        button.btn-action { 
            padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; 
            border: 1px solid var(--cordon-orange); background: rgba(0,0,0,0.6); color: white; 
            font-size: 0.75rem; text-transform: uppercase; transition: all 0.3s;
        }
        button.btn-action:hover:not(:disabled) { background: var(--cordon-orange); box-shadow: 0 0 8px var(--cordon-orange); color: #000; }
        
        /* Botón dinámico de fila interna */
        button.btn-row-add {
            background: rgba(255, 159, 67, 0.1); color: var(--cordon-orange);
            border: 1px dashed var(--cordon-orange); padding: 6px 14px; border-radius: 4px;
            font-size: 0.7rem; font-weight: bold; cursor: pointer; text-transform: uppercase;
            transition: all 0.2s; margin-top: 10px;
        }
        button.btn-row-add:hover:not(:disabled) { background: var(--cordon-orange); color: #000; }
        
        button:disabled { opacity: 0.2; cursor: not-allowed; }

        /* Cuadros de Nivelación Estilo Glassmorphism */
        .cuadro-wrapper {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border-top: 6px solid var(--cordon-orange);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }

        .cuadro-header {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            padding-right: 40px;
        }

        .sel-cuadro { width: 20px; height: 20px; cursor: pointer; accent-color: var(--cordon-orange); }

        .input-group { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.03); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); }
        .input-group label { color: var(--cordon-orange); font-weight: bold; font-size: 0.75rem; white-space: nowrap; text-transform: uppercase; }

        .header-input-field { background: transparent; border: none; color: #fff; font-weight: bold; font-size: 0.85rem; width: 80px; text-align: center; outline: none; }
        .header-input-field:focus { border-bottom: 1px solid var(--cordon-orange); }
        .header-readonly { color: var(--cordon-orange) !important; font-weight: 800; width: 90px; text-align: center; background: transparent; border: none; font-size: 0.85rem; }

        /* Contenedores de Tablas Hidráulicas/Viales */
        .table-responsive { overflow-x: auto; margin-top: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        table { width: 100%; border-collapse: collapse; background: #fff; color: #000; font-size: 11px; table-layout: fixed; }
        th { background: #2c3e50; color: #fff; padding: 8px; border: 1px solid #bbb; font-size: 0.7rem; text-transform: uppercase; }
        td { border: 1px solid #bbb; padding: 4px; text-align: center; font-weight: bold; }

        .cell-input { width: 100%; background: transparent; border: none; text-align: center; font-weight: bold; color: inherit; outline: none; font-size: 11px; box-sizing: border-box; }
        .cell-input:disabled { color: #777 !important; background: transparent !important; }
        .cell-input:not(:disabled) { background: rgba(0,0,0,0.04); }
        
        .res-field { background: #f1f5f9; color: #1e293b !important; }
        .cota-proy { color: #2ecc71 !important; }
        .lect-proy { color: #3498db !important; }

        @media print {
            body { background: white !important; color: black !important; padding: 0; }
            .btn-bar, .sel-cuadro, .btn-row-add, script, style { display: none !important; }
            .container { max-width: 100%; }
            .cuadro-wrapper { background: transparent !important; border: 1px solid #000 !important; box-shadow: none !important; padding: 15px !important; margin-bottom: 40px; page-break-inside: avoid; }
            .input-group { background: transparent !important; border: none !important; padding: 0 !important; }
            .input-group label { color: black !important; }
            .header-input-field { color: black !important; border-bottom: none !important; }
            .header-readonly { color: black !important; }
            table { border: 1px solid #000 !important; }
            th { background: #eaeaea !important; color: black !important; border: 1px solid #000 !important; }
            td { border: 1px solid #000 !important; color: black !important; }
            .cell-input { color: black !important; background: transparent !important; }
            .res-field { background: #eaeaea !important; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 10px;">
        <div>
            <h2 style="color: var(--cordon-orange); margin: 0; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; letter-spacing: 1px;">CONTROL DE NIVELACIÓN DE CORDONES</h2>
            <p style="color: #94a3b8; font-size: 0.7rem; margin: 3px 0 0 0; font-weight: bold; text-transform: uppercase;">S.I.G.I.V. - CONTROL DE OBRA CIVIL & VIAL</p>
        </div>
    </div>

    <div class="btn-bar">
        <button id="masterLock" class="btn-status locked" onclick="toggleLock()">Sistema Bloqueado</button>
        <button class="btn-action" id="btnAgregar" onclick="agregarCuadroManual()" disabled>+ Agregar Cuadro</button>
        <button class="btn-action" id="btnEliminar" style="border-color: #e74c3c; color: #e74c3c;" onclick="eliminarSeleccionados()" disabled>Eliminar Sel.</button>
        <button class="btn-action" style="border-color: var(--active-green); color: var(--active-green);" onclick="guardarDatosManual()">Guardar Cambios</button>
        <button class="btn-action" style="border-color: #f39c12; color: #f39c12;" onclick="exportarExcel()">Exportar Excel</button>
        <button class="btn-action" style="border-color: #ff6b6b; color: #ff6b6b; margin-left: auto;" onclick="confirmarVolver()">Volver</button>
    </div>

    <div id="hojaContenido"></div>
</div>

<script>
    let isUnlocked = false;
    let cambiosSinGuardar = false;
    let archivoNombre = "";

    window.onload = () => { 
        recuperarDatosMemoria(); 
    };

    window.addEventListener('beforeunload', function (e) {
        if (cambiosSinGuardar) {
            e.preventDefault();
            e.returnValue = ''; 
        }
    });

    function registrarCambio() { 
        cambiosSinGuardar = true; 
        guardarDatosEnMemoria(); 
    }

    function toggleLock() {
        isUnlocked = !isUnlocked;
        const btn = document.getElementById("masterLock");
        const btnAdd = document.getElementById("btnAgregar");
        const btnDel = document.getElementById("btnEliminar");
        
        btn.innerText = isUnlocked ? "Modo Edición Activo" : "Sistema Bloqueado";
        btn.className = `btn-status ${isUnlocked ? 'unlocked' : 'locked'}`;
        
        btnAdd.disabled = !isUnlocked;
        btnDel.disabled = !isUnlocked;
        actualizarEstadoGlobalInputs();
    }

    function actualizarEstadoGlobalInputs() {
        document.querySelectorAll("input:not(.res-field), button.btn-row-add").forEach(element => {
            element.disabled = !isUnlocked;
        });
    }

    function confirmarVolver() {
        if (cambiosSinGuardar && isUnlocked) {
            if (!confirm("¿Desea salir sin guardar? Los cambios recientes se perderán.")) return;
        }
        window.location.href = 'topografia.html';
    }

    function agregarCuadroManual() {
        inyectarCuadroHTML(Date.now(), null);
        registrarCambio();
    }

    function inyectarCuadroHTML(id, datosPrevios) {
        const contenedor = document.getElementById('hojaContenido');
        const div = document.createElement('div');
        div.className = 'cuadro-wrapper';
        div.id = `cuadro-${id}`;

        let pfNum = datosPrevios ? datosPrevios.pfNum : "";
        let cotaPf = datosPrevios ? datosPrevios.cotaPf : "";
        let lectAtras = datosPrevios ? datosPrevios.lectAtras : "";
        let pvInst = datosPrevios ? datosPrevios.pvInst : "0.000";
        let cotaIni = datosPrevios ? datosPrevios.cotaIni : "";
        let cotaFin = datosPrevios ? datosPrevios.cotaFin : "";
        let distTotal = datosPrevios ? datosPrevios.distTotal : "";
        let pendM = datosPrevios ? datosPrevios.pendM : "0.00000";

        div.innerHTML = `
            <div class="cuadro-header">
                <input type="checkbox" class="sel-cuadro" title="Seleccionar para eliminar" ${isUnlocked ? '' : 'disabled'}>
                <div class="input-group"><label>P.F. Nº:</label><input type="text" class="header-input-field" value="${pfNum}" oninput="registrarCambio()" ${isUnlocked ? '' : 'disabled'}></div>
                <div class="input-group"><label>COTA P.F.:</label><input type="number" step="0.001" class="header-input-field calc-pv" value="${cotaPf}" oninput="recalcPV(${id}); registrarCambio();" ${isUnlocked ? '' : 'disabled'}></div>
                <div class="input-group"><label>LECT. ATRÁS:</label><input type="number" step="0.001" class="header-input-field calc-pv" value="${lectAtras}" oninput="recalcPV(${id}); registrarCambio();" ${isUnlocked ? '' : 'disabled'}></div>
                <div class="input-group"><label>P.V. (Inst.):</label><input type="number" id="pv-${id}" class="header-readonly" value="${pvInst}" readonly disabled></div>
                <div class="input-group"><label>COTA INI:</label><input type="number" step="0.001" id="cota-ini-${id}" class="header-input-field" value="${cotaIni}" oninput="recalcCuadro(${id}); registrarCambio();" ${isUnlocked ? '' : 'disabled'}></div>
                <div class="input-group"><label>COTA FIN:</label><input type="number" step="0.001" id="cota-fin-${id}" class="header-input-field" value="${cotaFin}" oninput="recalcCuadro(${id}); registrarCambio();" ${isUnlocked ? '' : 'disabled'}></div>
                <div class="input-group"><label>DIST. TOTAL:</label><input type="number" step="0.01" id="dist-total-${id}" class="header-input-field" value="${distTotal}" oninput="recalcCuadro(${id}); registrarCambio();" ${isUnlocked ? '' : 'disabled'}></div>
                <div class="input-group"><label>PEND/m:</label><input type="number" id="pend-${id}" class="header-readonly" value="${pendM}" readonly disabled></div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th width="15%">DIST. (m)</th>
                            <th width="20%">COTA PROYECTO</th>
                            <th width="20%">LECT. PROYECTADA</th>
                            <th width="25%">LECT. EXISTENTE (Campo)</th>
                            <th width="20%">DIFERENCIA (mm)</th>
                        </tr>
                    </thead>
                    <tbody id="body-${id}">
                    </tbody>
                </table>
            </div>
            <button class="btn-row-add" onclick="agregarFilaAFT(${id}, '', '')" ${isUnlocked ? '' : 'disabled'}>+ Agregar Fila</button>
        `;
        contenedor.appendChild(div);

        if (datosPrevios && datosPrevios.filas && datosPrevios.filas.length > 0) {
            datosPrevios.filas.forEach(f => agregarFilaAFT(id, f.dist, f.lectExist));
            recalcPV(id);
        } else {
            agregarFilaAFT(id, '', '');
        }
    }

    function agregarFilaAFT(cuadroId, distVal, lectExistVal) {
        const tbody = document.getElementById(`body-${cuadroId}`);
        if(!tbody) return;

        const tr = document.createElement('tr');
        tr.oninput = () => recalcCuadro(cuadroId);
        tr.innerHTML = `
            <td><input type="number" step="0.01" class="cell-input dist-parcial" value="${distVal}" oninput="registrarCambio()" ${isUnlocked ? '' : 'disabled'}></td>
            <td><input type="text" class="cell-input res-field cota-proy" value="0.000" readonly disabled></td>
            <td><input type="text" class="cell-input res-field lect-proy" value="0.000" readonly disabled></td>
            <td><input type="number" step="0.001" class="cell-input lect-exist" value="${lectExistVal}" oninput="registrarCambio()" ${isUnlocked ? '' : 'disabled'}></td>
            <td><input type="text" class="cell-input res-field diff" value="0" readonly disabled style="font-weight:800;"></td>
        `;
        tbody.appendChild(tr);
        recalcCuadro(cuadroId);
    }

    function recalcPV(id) {
        const cuadro = document.getElementById(`cuadro-${id}`);
        if(!cuadro) return;
        const inputs = cuadro.querySelectorAll('.calc-pv');
        const cotaPF = parseFloat(inputs[0].value) || 0;
        const lectAtras = parseFloat(inputs[1].value) || 0;
        document.getElementById(`pv-${id}`).value = (cotaPF + lectAtras).toFixed(3);
        recalcCuadro(id);
    }

    function recalcCuadro(id) {
        const tbody = document.getElementById(`body-${id}`);
        if(!tbody) return;

        const cotaIni = parseFloat(document.getElementById(`cota-ini-${id}`).value) || 0;
        const cotaFin = parseFloat(document.getElementById(`cota-fin-${id}`).value) || 0;
        const distTot = parseFloat(document.getElementById(`dist-total-${id}`).value) || 1;
        const pv = parseFloat(document.getElementById(`pv-${id}`).value) || 0;

        const pendiente = (cotaIni - cotaFin) / distTot;
        document.getElementById(`pend-${id}`).value = pendiente.toFixed(5);

        const filas = tbody.querySelectorAll('tr');
        let distAcumulada = 0;

        filas.forEach((fila) => {
            const dist = parseFloat(fila.querySelector('.dist-parcial').value) || 0;
            distAcumulada += dist;

            const cotaProy = cotaIni - (distAcumulada * pendiente);
            const lectProy = pv - cotaProy;
            const lectExistInput = fila.querySelector('.lect-exist');
            const lectExist = parseFloat(lectExistInput.value) || 0;

            fila.querySelector('.cota-proy').value = cotaProy.toFixed(3);
            fila.querySelector('.lect-proy').value = lectProy.toFixed(3);
            
            const outDiff = fila.querySelector('.diff');
            if(lectExistInput.value !== "" && lectExist !== 0) {
                const diff = (lectExist - lectProy) * 1000;
                outDiff.value = (diff > 0 ? "+" : "") + diff.toFixed(0);
                outDiff.style.color = Math.abs(diff) > 10 ? '#e74c3c' : '#2ecc71'; 
            } else {
                outDiff.value = "0";
                outDiff.style.color = 'inherit';
            }
        });
    }

    function eliminarSeleccionados() {
        if(!isUnlocked) return;
        const seleccionados = document.querySelectorAll('.sel-cuadro:checked');
        if(seleccionados.length === 0) return alert("Por favor, seleccione las planillas viales que desea quitar activando su casilla izquierda.");
        
        if(confirm(`¿Confirma que desea eliminar ${seleccionados.length} cuadro(s) de nivelación de la memoria activa?`)) {
            seleccionados.forEach(check => check.closest('.cuadro-wrapper').remove());
            registrarCambio();
        }
    }

    function guardarDatosEnMemoria() {
        const cuadros = document.querySelectorAll('.cuadro-wrapper');
        let dataPack = [];

        cuadros.forEach(cuadro => {
            const id = cuadro.id.replace('cuadro-', '');
            const inputsHeader = cuadro.querySelectorAll('.header-input-field');
            
            let filas = [];
            const tbody = document.getElementById(`body-${id}`);
            if(tbody) {
                tbody.querySelectorAll('tr').forEach(tr => {
                    filas.push({
                        dist: tr.querySelector('.dist-parcial').value,
                        lectExist: tr.querySelector('.lect-exist').value
                    });
                });
            }

            dataPack.push({
                id: id,
                pfNum: inputsHeader[0].value,
                cotaPf: inputsHeader[1].value,
                lectAtras: inputsHeader[2].value,
                pvInst: document.getElementById(`pv-${id}`).value,
                cotaIni: document.getElementById(`cota-ini-${id}`).value,
                cotaFin: document.getElementById(`cota-fin-${id}`).value,
                distTotal: document.getElementById(`dist-total-${id}`).value,
                pendM: document.getElementById(`pend-${id}`).value,
                filas: filas
            });
        });
        localStorage.setItem('datosTopCordonesDinamic', JSON.stringify(dataPack));
    }

    function guardarDatosManual() {
        guardarDatosEnMemoria();
        cambiosSinGuardar = false;
        alert("¡Estructuras dinámicas viales guardadas con éxito!");
        if(isUnlocked) toggleLock();
    }

    function recuperarDatosMemoria() {
        try {
            const packAlmacenado = localStorage.getItem('datosTopCordonesDinamic');
            if (packAlmacenado) {
                const dataPack = JSON.parse(packAlmacenado);
                if(Array.isArray(dataPack) && dataPack.length > 0) {
                    dataPack.forEach(datosCuadro => inyectarCuadroHTML(datosCuadro.id, datosCuadro));
                    return;
                }
            }
        } catch(err) {
            localStorage.removeItem('datosTopCordonesDinamic');
        }
        inyectarCuadroHTML(Date.now(), null); 
    }

    async function exportarExcel() {
        guardarDatosEnMemoria();
        const wb = XLSX.utils.book_new();
        const cuadros = document.querySelectorAll('.cuadro-wrapper');
        
        if(cuadros.length === 0) return alert("No hay datos cargados para exportar.");

        cuadros.forEach((cuadro, idx) => {
            const id = cuadro.id.replace('cuadro-', '');
            const pf = cuadro.querySelectorAll('.header-input-field')[0].value || `Cuadro_${idx+1}`;
            
            const data = [
                ["S.I.G.I.V. - CONTROL DE NIVELACIÓN DE CORDONES"],
                [`P.F. Nº: ${pf}`, `COTA P.F: ${cuadro.querySelectorAll('.header-input-field')[1].value}`, `LECT. ATRÁS: ${cuadro.querySelectorAll('.header-input-field')[2].value}`, `P.V.: ${document.getElementById(`pv-${id}`).value}`],
                [`COTA INI: ${document.getElementById(`cota-ini-${id}`).value}`, `COTA FIN: ${document.getElementById(`cota-fin-${id}`).value}`, `DIST. TOTAL: ${document.getElementById(`dist-total-${id}`).value}`, `PEND/m: ${document.getElementById(`pend-${id}`).value}`],
                [],
                ["DISTANCIA (m)", "COTA PROYECTO", "LECT. PROYECTADA", "LECT. EXISTENTE (Campo)", "DIFERENCIA (mm)"]
            ];

            const tbody = document.getElementById(`body-${id}`);
            if(tbody) {
                tbody.querySelectorAll('tr').forEach(tr => {
                    data.push([
                        tr.querySelector('.dist-parcial').value,
                        tr.querySelector('.cota-proy').value,
                        tr.querySelector('.lect-proy').value,
                        tr.querySelector('.lect-exist').value,
                        tr.querySelector('.diff').value
                    ]);
                });
            }

            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), `PF_${pf}`.substring(0,30).replace(/[\\/?*\[\]]/g, "_"));
        });

        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

        if ('showSaveFilePicker' in window) {
            try {
                const handle = await window.showSaveFilePicker({
                    suggestedName: archivoNombre || 'SIGIV_Control_Cordones.xlsx',
                    types: [{ description: 'Excel viales', accept: {'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx']} }]
                });
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                archivoNombre = handle.name;
                cambiosSinGuardar = false;
                alert("Planilla exportada exitosamente.");
            } catch (e) {}
        } else {
            XLSX.writeFile(wb, "SIGIV_Control_Cordones.xlsx");
            cambiosSinGuardar = false;
        }
    }
</script>
</body>
</html>
