<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Levantamiento de Perfiles</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { 
            --perfil-color: #4a5568; /* Color Identidad: Gris Plomo de Precisión */
            --cyan-electric: #00f2ff; /* Azul Cian Eléctrico para destaques */
            --glass: rgba(10, 15, 25, 0.95); 
            --border: rgba(0, 242, 255, 0.15);
            --active-green: #2ecc71;
            --locked-red: #e74c3c;
        }

        body { 
            background: #0d1117 url('fondo_previos.jpg') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
        }

        .container { max-width: 98%; margin: auto; }

        /* Barra de Herramientas Estilo S.I.G.I.V. */
        .btn-bar { 
            position: sticky; 
            top: 10px; 
            z-index: 1000; 
            display: flex; 
            gap: 12px; 
            justify-content: flex-start; 
            background: rgba(0, 0, 0, 0.85); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-status { 
            padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; 
            border: 1px solid rgba(255,255,255,0.1); text-transform: uppercase; font-size: 0.75rem; color: white;
            transition: all 0.3s ease;
        }
        .locked { background: var(--locked-red); }
        .unlocked { background: var(--active-green); box-shadow: 0 0 15px var(--active-green); color: #000 !important; font-weight: 800; }
        
        button.btn-action { 
            padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; 
            border: 1px solid var(--perfil-color); background: rgba(0,0,0,0.6); color: white; 
            font-size: 0.75rem; text-transform: uppercase; transition: all 0.3s;
        }
        button.btn-action:hover:not(:disabled) { background: var(--perfil-color); box-shadow: 0 0 8px var(--cyan-electric); color: var(--cyan-electric); }

        /* Bloques de Perfil */
        .perfil-block { 
            background: var(--glass); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); 
            border-radius: 15px; 
            padding: 20px; 
            margin-bottom: 35px; 
            border-top: 6px solid var(--cyan-electric); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }

        .btn-eliminar-bloque {
            position: absolute; top: 15px; right: 15px;
            background: rgba(231, 76, 60, 0.2); color: #e74c3c;
            border: 1px solid #e74c3c; width: 28px; height: 28px;
            border-radius: 4px; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
            z-index: 10;
        }
        .btn-eliminar-bloque:hover { background: #e74c3c; color: white; }

        .calc-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .pv-group { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .grid-inputs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; align-items: center; font-size: 11px; }
        
        /* Tabla */
        .table-responsive { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; background: #fff; color: #000; font-size: 11px; table-layout: fixed; }
        th { background: #2c3e50; color: #fff; padding: 6px; border: 1px solid #bbb; text-transform: uppercase; font-size: 11px; }
        td { border: 1px solid #bbb; padding: 4px; text-align: center; font-weight: bold; }
        
        input { width: 100%; background: transparent; border: none; text-align: center; font-weight: bold; color: inherit; outline: none; font-size: 11px; box-sizing: border-box; }
        input:disabled { color: #777 !important; background: transparent !important; }
        input:not(:disabled) { background: rgba(0,0,0,0.04); }
        
        .row-eje { background-color: #fff2cc !important; }
        .res { background: #f1f5f9; color: #1e293b !important; }
        
        .titulo-input { background: transparent; border: none; border-bottom: 1px solid var(--cyan-electric); color: #fff; font-size: 1.1rem; text-align: left; width: 200px; font-weight: bold; }
        .prog-in { background: transparent; border: none; border-bottom: 1px solid var(--cyan-electric); color: var(--cyan-electric); font-size: 1.1rem; text-align: left; width: 150px; font-weight: bold; }

        @media print {
            body { background: white !important; color: black !important; padding: 0; }
            .btn-bar, .btn-eliminar-bloque, .btn-action, script, style { display: none !important; }
            .perfil-block { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; margin-bottom: 50px; page-break-inside: avoid; }
            .prog-in { color: black !important; border-bottom: none !important; }
            table { border: 1px solid #000 !important; }
            th { background: #eaeaea !important; color: black !important; border: 1px solid #000 !important; }
            td { border: 1px solid #000 !important; color: black !important; }
            input { color: black !important; background: transparent !important; }
            .res { background: #eaeaea !important; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 10px;">
        <div>
            <h2 style="color: var(--cyan-electric); margin: 0; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; letter-spacing: 1px;">LEVANTAMIENTO DE PERFILES PREVIOS / DEFINITIVOS</h2>
            <p style="color: #94a3b8; font-size: 0.7rem; margin: 3px 0 0 0; font-weight: bold; text-transform: uppercase;">S.I.G.I.V. - ÁREA DE TOPOGRAFÍA</p>
        </div>
    </div>

    <div class="btn-bar">
        <button id="masterLock" class="btn-status locked" onclick="toggleMasterLock()">Sistema Bloqueado</button>
        <button class="btn-action" id="btnAgregar" onclick="crearNuevoPerfil()" disabled>+ Agregar Perfil</button>
        <button class="btn-action" style="border-color: var(--active-green); color: var(--active-green);" onclick="guardarDatosManual()">Guardar Cambios</button>
        <button class="btn-action" style="border-color: #f39c12; color: #f39c12;" onclick="ejecutarGuardado()">Exportar Excel</button>
        <button class="btn-action" style="border-color: #ff9f43; color: #ff9f43;" onclick="borrarMemoriaYResetear()">Limpiar Tabla</button>
        <button class="btn-action" style="border-color: #ff6b6b; color: #ff6b6b; margin-left: auto;" onclick="volver()">Volver</button>
    </div>

    <div id="contenedor-perfiles"></div>
</div>

<script>
    let isUnlocked = false; 
    let perfilCount = 0;
    let archivoNombre = "";
    let cambiosSinGuardar = false;

    window.onload = () => {
        recuperarDatosMemoria();
    };

    window.addEventListener('beforeunload', function (e) {
        if (cambiosSinGuardar) {
            e.preventDefault();
            e.returnValue = ''; 
        }
    });

    function registrarCambio() { 
        cambiosSinGuardar = true; 
        guardarDatosEnMemoria(); 
    }

    function toggleMasterLock() {
        isUnlocked = !isUnlocked;
        const btn = document.getElementById("masterLock");
        const btnAdd = document.getElementById("btnAgregar");
        btn.innerText = isUnlocked ? "Modo Edición Activo" : "Sistema Bloqueado";
        btn.className = `btn-status ${isUnlocked ? 'unlocked' : 'locked'}`;
        
        btnAdd.disabled = !isUnlocked;
        actualizarEstadoGlobal();
    }

    function actualizarEstadoGlobal() {
        document.querySelectorAll("input:not(.res)").forEach(inp => {
            inp.disabled = !isUnlocked;
        });
        document.querySelectorAll(".btn-eliminar-bloque").forEach(btn => {
            btn.style.display = isUnlocked ? "flex" : "none";
        });
    }

    function volver() {
        if (cambiosSinGuardar && isUnlocked) {
            if (!confirm("¿Desea salir sin guardar? Los cambios recientes se perderán.")) return;
        }
        window.location.href = 'topografia.html';
    }

    function borrarMemoriaYResetear() {
        if(confirm("¿Seguro que querés vaciar por completo esta planilla de Perfiles?\nSe eliminarán de raíz todos los registros guardados.")){
            localStorage.removeItem('datosTopLevantamiento21');
            cambiosSinGuardar = false;
            location.reload();
        }
    }

    function crearNuevoPerfil(datosPrevios = null) {
        perfilCount++;
        const id = datosPrevios ? datosPrevios.id : `p_${Date.now()}_${perfilCount}`;
        
        let progValor = "";
        let pvPrevioVals = ["", "", "", "", "", ""];
        let pvDefVals = ["", "", "", "", "", ""];
        let filasData = null;

        if (datosPrevios) {
            progValor = datosPrevios.progValor || "";
            pvPrevioVals = datosPrevios.pvPrevioVals || ["", "", "", "", "", ""];
            pvDefVals = datosPrevios.pvDefVals || ["", "", "", "", "", ""];
            filasData = datosPrevios.filasData || null;
        }

        const div = document.createElement('div');
        div.className = 'perfil-block';
        div.id = id;

        div.innerHTML = `
            <button class="btn-eliminar-bloque" onclick="eliminarPerfil('${id}')" style="display:${isUnlocked ? 'flex' : 'none'};">×</button>
            <div style="margin-bottom:15px; font-size: 1.1em;">
                <b style="color:var(--cyan-electric);">PROGRESIVA:</b> 
                <input type="text" class="prog-in" value="${progValor}" placeholder="0+000" oninput="registrarCambio()">
            </div>
            <div class="calc-panel">
                ${generarPVPanel(id, 'PREVIO', 'p', pvPrevioVals)}
                ${generarPVPanel(id, 'DEFINITIVO', 'd', pvDefVals)}
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th width="10%">PUNTO (P)</th><th width="15%">LECT (P)</th><th width="15%">COTA (P)</th>
                            <th width="10%" style="background:#1e293b; color:#fff">PUNTO (D)</th><th width="15%" style="background:#1e293b; color:#fff">LECT (D)</th><th width="15%" style="background:#1e293b; color:#fff">COTA (D)</th>
                            <th width="20%" style="background:#7f1d1d; color:#fff">DIFERENCIA</th>
                        </tr>
                    </thead>
                    <tbody>${generarFilas21(id, filasData)}</tbody>
                </table>
            </div>
        `;
        document.getElementById('contenedor-perfiles').appendChild(div);
        actualizarEstadoGlobal();
        calc(id);
        if(!datosPrevios) { registrarCambio(); }
    }

    function eliminarPerfil(id) {
        if(!isUnlocked) return;
        const bloque = document.getElementById(id);
        if(bloque && confirm("¿Desea eliminar esta progresiva del levantamiento?")) {
            bloque.remove();
            registrarCambio();
        }
    }

    function generarPVPanel(id, tit, pre, vals) {
        return `<div class="pv-group">
            <h3 style="margin:0 0 10px 0; font-size:12px; color:var(--cyan-electric); border-bottom:1px solid rgba(255,255,255,0.15); text-transform:uppercase; font-weight:800;">${tit}</h3>
            <div class="grid-inputs">
                <span>Cota PF:</span><input type="number" step="0.001" class="calc-in" value="${vals[0]}" oninput="calc('${id}'); registrarCambio();">
                <span>Lect PF:</span><input type="number" step="0.001" class="calc-in" value="${vals[1]}" oninput="calc('${id}'); registrarCambio();">
                <b id="${id}-${pre}-v1" style="color:#2ecc71">PV1: 0.000</b>
                
                <span>Lect Ad1:</span><input type="number" step="0.001" class="calc-in" value="${vals[2]}" oninput="calc('${id}'); registrarCambio();">
                <span>Lect Esp1:</span><input type="number" step="0.001" class="calc-in" value="${vals[3]}" oninput="calc('${id}'); registrarCambio();">
                <b id="${id}-${pre}-v2" style="color:#3498db">PV2: 0.000</b>
                
                <span>Lect Ad2:</span><input type="number" step="0.001" class="calc-in" value="${vals[4]}" oninput="calc('${id}'); registrarCambio();">
                <span>Lect Esp2:</span><input type="number" step="0.001" class="calc-in" value="${vals[5]}" oninput="calc('${id}'); registrarCambio();">
                <b id="${id}-${pre}-v3" style="color:#e74c3c">PV3: 0.000</b>
            </div>
        </div>`;
    }

    function generarFilas21(id, filasData) {
        let rows = '';
        for(let i=1; i<=21; i++) {
            let labelDefecto = (i === 11) ? 'EJE' : (i < 11 ? i : i - 1);
            let pLabel = labelDefecto;
            let dLabel = labelDefecto;
            let pLect = "";
            let dLect = "";

            if (filasData && filasData[i-1]) {
                pLabel = filasData[i-1].pLabel;
                pLect = filasData[i-1].pLect;
                dLabel = filasData[i-1].dLabel;
                dLect = filasData[i-1].dLect;
            }

            rows += `<tr ${i===11 ? 'class="row-eje"' : ''}>
                <td><input type="text" value="${pLabel}" oninput="registrarCambio()"></td>
                <td><input type="number" step="0.001" value="${pLect}" oninput="calc('${id}'); registrarCambio();"></td>
                <td><input type="text" value="0.000" disabled class="res"></td>
                <td><input type="text" value="${dLabel}" oninput="registrarCambio()"></td>
                <td><input type="number" step="0.001" value="${dLect}" oninput="calc('${id}'); registrarCambio();"></td>
                <td><input type="text" value="0.000" disabled class="res"></td>
                <td><input type="text" value="0.000" disabled class="res" style="font-weight:800;"></td>
            </tr>`;
        }
        return rows;
    }

    function calc(id) {
        const b = document.getElementById(id);
        if(!b) return;
        const ins = b.querySelectorAll('.calc-in');
        
        const proc = (start, pLabel) => {
            const cp = parseFloat(ins[start].value)||0, lp = parseFloat(ins[start+1].value)||0;
            const a1 = parseFloat(ins[start+2].value)||0, e1 = parseFloat(ins[start+3].value)||0;
            const a2 = parseFloat(ins[start+4].value)||0, e2 = parseFloat(ins[start+5].value)||0;

            const v1 = cp + lp;
            const v2 = (a1 !== 0 || e1 !== 0) ? (v1 - a1) + e1 : v1;
            const v3 = (a2 !== 0 || e2 !== 0) ? (v2 - a2) + e2 : v2;

            document.getElementById(`${id}-${pLabel}-v1`).innerText = `PV1: ${v1.toFixed(3)}`;
            document.getElementById(`${id}-${pLabel}-v2`).innerText = `PV2: ${v2.toFixed(3)}`;
            document.getElementById(`${id}-${pLabel}-v3`).innerText = `PV3: ${v3.toFixed(3)}`;
            return { v1, v2, v3, has1: (a1!==0||e1!==0), has2: (a2!==0||e2!==0) };
        };

        const resP = proc(0, 'p');
        const resD = proc(6, 'd');

        b.querySelectorAll('tbody tr').forEach((r, i) => {
            // Lógica original: PV1 (1-10), PV2 (11-17 si hay cambio), PV3 (18-21 si hay cambio)
            let curVP = (resP.has2 && i >= 17) ? resP.v3 : (resP.has1 && i >= 10 ? resP.v2 : resP.v1);
            let curVD = (resD.has2 && i >= 17) ? resD.v3 : (resD.has1 && i >= 10 ? resD.v2 : resD.v1);

            const lp = parseFloat(r.cells[1].querySelector('input').value)||0;
            const ld = parseFloat(r.cells[4].querySelector('input').value)||0;

            const cP = curVP - lp;
            const cD = curVD - ld;
            const dif = cD - cP;

            r.cells[2].querySelector('input').value = cP.toFixed(3);
            r.cells[5].querySelector('input').value = cD.toFixed(3);
            
            const outDif = r.cells[6].querySelector('input');
            outDif.value = (dif > 0 ? "+" : "") + dif.toFixed(3);
            outDif.style.color = dif > 0 ? "#00f2ff" : (dif < 0 ? "#ff4d4d" : "inherit");
        });
    }

    function guardarDatosEnMemoria() {
        const bloques = document.querySelectorAll('.perfil-block');
        let dataPack = [];

        bloques.forEach(b => {
            const ins = b.querySelectorAll('.calc-in');
            let pvPrevioVals = [];
            let pvDefVals = [];
            
            for(let i=0; i<6; i++) pvPrevioVals.push(ins[i].value);
            for(let i=6; i<12; i++) pvDefVals.push(ins[i].value);

            let filasData = [];
            b.querySelectorAll('tbody tr').forEach(r => {
                filasData.push({
                    pLabel: r.cells[0].querySelector('input').value,
                    pLect: r.cells[1].querySelector('input').value,
                    dLabel: r.cells[3].querySelector('input').value,
                    dLect: r.cells[4].querySelector('input').value
                });
            });

            dataPack.push({
                id: b.id,
                progValor: b.querySelector('.prog-in').value,
                pvPrevioVals: pvPrevioVals,
                pvDefVals: pvDefVals,
                filasData: filasData
            });
        });
        localStorage.setItem('datosTopLevantamiento21', JSON.stringify(dataPack));
    }

    function guardarDatosManual() {
        guardarDatosEnMemoria();
        cambiosSinGuardar = false;
        alert("¡Estructura de perfiles (21 puntos) guardada con éxito en la memoria!");
        if(isUnlocked) toggleMasterLock();
    }

    function recuperarDatosMemoria() {
        try {
            const packAlmacenado = localStorage.getItem('datosTopLevantamiento21');
            if (packAlmacenado) {
                const dataPack = JSON.parse(packAlmacenado);
                if(Array.isArray(dataPack) && dataPack.length > 0) {
                    dataPack.forEach(datosBloque => crearNuevoPerfil(datosBloque));
                    return;
                }
            }
        } catch(err) {
            localStorage.removeItem('datosTopLevantamiento21');
        }
        crearNuevoPerfil();
    }

    async function ejecutarGuardado() {
        guardarDatosEnMemoria();
        const wb = XLSX.utils.book_new();
        const bloques = document.querySelectorAll('.perfil-block');
        
        if(bloques.length === 0) return alert("No hay perfiles cargados.");

        bloques.forEach((b, idx) => {
            const prog = b.querySelector('.prog-in').value || `Perfil_${idx+1}`;
            const data = [["PUNTO P", "LECT P", "COTA P", "PUNTO D", "LECT D", "COTA D", "DIFERENCIA"]];
            
            b.querySelectorAll('tbody tr').forEach(tr => {
                const inputs = tr.querySelectorAll('input');
                data.push([
                    inputs[0].value,
                    inputs[1].value,
                    tr.cells[2].querySelector('input').value,
                    inputs[2].value,
                    inputs[3].value,
                    tr.cells[5].querySelector('input').value,
                    tr.cells[6].querySelector('input').value
                ]);
            });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), prog.substring(0, 30).replace(/[\\/?*\[\]]/g, "_"));
        });

        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

        if ('showSaveFilePicker' in window) {
            try {
                const handle = await window.showSaveFilePicker({
                    suggestedName: archivoNombre || 'S_I_G_I_V_Levantamiento_Perfiles.xlsx',
                    types: [{ description: 'Excel', accept: {'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx']} }]
                });
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                archivoNombre = handle.name;
                cambiosSinGuardar = false;
                alert("Archivo Excel exportado con éxito.");
            } catch (e) {}
        } else {
            XLSX.writeFile(wb, "S_I_G_I_V_Levantamiento_Perfiles.xlsx");
            cambiosSinGuardar = false;
        }
    }
</script>
</body>
</html>
