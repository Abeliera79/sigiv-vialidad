<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Planilla de Control Sub-Base</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { 
            --subbase-color: #34495e; /* Color Identidad: Gris Cemento / Azul Vial */
            --bronze: #00f2ff; /* Neón Azul para destacar en Sub-Base */
            --glass: rgba(15, 23, 42, 0.95); 
            --border: rgba(0, 242, 255, 0.2);
            --active-green: #2ecc71; 
            --locked-red: #e74c3c; 
        }
        
        body { 
            background: #111 url('Fondo_subbase.jpg') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
        }

        .container { max-width: 98%; margin: auto; }

        .btn-bar { 
            position: sticky; 
            top: 10px; 
            z-index: 1000; 
            display: flex; 
            gap: 12px; 
            justify-content: flex-start; 
            background: rgba(0,0,0,0.85); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            border: 1px solid var(--subbase-color); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-status { 
            padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; 
            border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase; font-size: 0.75rem; color: white;
            transition: all 0.3s ease;
        }
        .locked { background: var(--locked-red); }
        .unlocked { background: var(--active-green); box-shadow: 0 0 15px var(--active-green); color: #000 !important; font-weight: 800; }
        
        button.btn-action { 
            padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; 
            border: 1px solid var(--subbase-color); background: rgba(0,0,0,0.6); color: white; 
            font-size: 0.75rem; text-transform: uppercase; transition: all 0.3s;
        }
        button.btn-action:hover:not(:disabled) { background: var(--subbase-color); box-shadow: 0 0 8px var(--bronze); }

        .sub-block { 
            background: var(--glass); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); 
            border-radius: 15px; 
            padding: 20px; 
            margin-bottom: 30px; 
            border-top: 6px solid var(--subbase-color); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }

        .btn-eliminar-bloque {
            position: absolute; top: 15px; right: 15px;
            background: rgba(231, 76, 60, 0.2); color: #e74c3c;
            border: 1px solid #e74c3c; width: 28px; height: 28px;
            border-radius: 4px; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn-eliminar-bloque:hover { background: #e74c3c; color: white; }

        .table-responsive { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; background: #fff; color: #000; font-size: 11px; table-layout: fixed; }
        td { border: 1px solid #bbb; padding: 5px; text-align: center; font-weight: bold; }
        
        .w-control { width: 90px; }
        .w-header-pv { width: 80px; }
        
        input { width: 100%; background: transparent; border: none; text-align: center; font-weight: bold; color: inherit; outline: none; font-size: 11px; box-sizing: border-box; }
        input:disabled { color: #777 !important; background: transparent !important; }
        input:not(:disabled) { background: rgba(0,0,0,0.05); }
        
        .res { background: #f1f5f9; color: #1e293b !important; }
        .header-pv { background: #cbd5e1; color: #0f172a; }
        .header-geom { background: #2c3e50; color: white; }
        
        .diff { font-size: 12px; font-weight: 800; }
        .titulo-input { background: transparent; border: none; border-bottom: 1px solid var(--subbase-color); color: #fff; font-size: 1.1rem; text-align: left; width: 300px; font-weight: bold; }
        .prog-in { background: transparent; border: none; border-bottom: 1px solid var(--subbase-color); color: var(--bronze); font-size: 1.1rem; text-align: center; width: 120px; font-weight: bold; }

        @media print {
            body { background: white !important; color: black !important; padding: 0; }
            .btn-bar, .btn-eliminar-bloque, .btn-action, script, style { display: none !important; }
            .sub-block { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; margin-bottom: 50px; page-break-inside: avoid; }
            .titulo-input, .prog-in { color: black !important; border-bottom: none !important; }
            table { border: 1px solid #000 !important; }
            td { border: 1px solid #000 !important; color: black !important; }
            input { color: black !important; background: transparent !important; }
            .res { background: #eaeaea !important; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 10px;">
        <div>
            <h2 style="color: var(--bronze); margin: 0; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; letter-spacing: 1px;">CONTROL DE NIVELACIÓN SUB-BASE</h2>
            <p style="color: #94a3b8; font-size: 0.7rem; margin: 3px 0 0 0; font-weight: bold; text-transform: uppercase;">S.I.G.I.V. - ÁREA DE TOPOGRAFÍA</p>
        </div>
    </div>

    <div class="btn-bar">
        <button id="masterLock" class="btn-status locked" onclick="toggleLock()">Sistema Bloqueado</button>
        <button class="btn-action" id="btnAgregar" onclick="agregarBloque()" disabled>+ Agregar Progresiva</button>
        <button class="btn-action" style="border-color: #2ecc71; color: #2ecc71;" onclick="guardarDatosManual()">Guardar Cambios</button>
        <button class="btn-action" style="border-color: #f39c12; color: #f39c12;" onclick="ejecutarExcel()">Exportar Excel</button>
        <button class="btn-action" style="border-color: #ff9f43; color: #ff9f43;" onclick="borrarMemoriaYResetear()">Limpiar Tabla</button>
        <button class="btn-action" style="border-color: #ff6b6b; color: #ff6b6b; margin-left: auto;" onclick="confirmarVolver()">Volver</button>
    </div>

    <div id="contenedor-planillas"></div>
</div>

<script>
    let isUnlocked = false;
    let cambiosSinGuardar = false;

    window.onload = () => { 
        recuperarDatosMemoria(); 
    };

    window.addEventListener('beforeunload', function (e) {
        if (cambiosSinGuardar) {
            e.preventDefault();
            e.returnValue = ''; 
        }
    });

    // Registra cualquier cambio en inputs y ejecuta el auto-guardado en tiempo real
    function registrarCambio() { 
        cambiosSinGuardar = true; 
        guardarDatosEnMemoria(); 
    }

    function toggleLock() {
        isUnlocked = !isUnlocked;
        const btn = document.getElementById("masterLock");
        const btnAdd = document.getElementById("btnAgregar");
        btn.innerText = isUnlocked ? "Modo Edición Activo" : "Sistema Bloqueado";
        btn.className = `btn-status ${isUnlocked ? 'unlocked' : 'locked'}`;
        
        btnAdd.disabled = !isUnlocked;
        actualizarEstadoGlobalInputs();
    }

    function actualizarEstadoGlobalInputs() {
        document.querySelectorAll("input:not(.res)").forEach(inp => {
            inp.disabled = !isUnlocked;
        });
        document.querySelectorAll(".btn-eliminar-bloque").forEach(btn => {
            btn.style.display = isUnlocked ? "flex" : "none";
        });
    }

    function confirmarVolver() {
        guardarDatosEnMemoria();
        cambiosSinGuardar = false;
        window.location.href = 'topografia.html';
    }

    function borrarMemoriaYResetear() {
        if(confirm("¿Seguro que querés vaciar por completo esta planilla de Sub-Base?\nSe eliminarán de raíz todos los registros guardados.")){
            localStorage.removeItem('datosTopSubbase');
            cambiosSinGuardar = false;
            location.reload();
        }
    }

    function agregarBloque(datosPrevios = null) {
        let id = datosPrevios ? datosPrevios.id : 'b_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        
        let cotaInicial = "0.000";
        let geoValores = ["2", "2", "2", "2", "2", "2", "2", "2"]; 
        let tituloPrevio = "CONTROL DE SUB BASE"; 
        let progValor = "0+000";
        let inputPvValores = ["", "", "", "", "", ""]; 
        let inputEjeValor = "";
        let inputLectExistValores = ["", "", "", "", "", "", ""];

        if (!datosPrevios) {
            const bloquesExistentes = document.querySelectorAll('.sub-block');
            if (bloquesExistentes.length > 0) {
                const ultimoBloque = bloquesExistentes[bloquesExistentes.length - 1];
                const pvFinalElement = ultimoBloque.querySelector('.pv-final-val');
                cotaInicial = pvFinalElement ? pvFinalElement.innerText : "0.000";
                tituloPrevio = ultimoBloque.querySelector('.titulo-input').value;
                ultimoBloque.querySelectorAll('.calc-geo').forEach((el, i) => {
                    geoValores[i] = el.value;
                });
            }
        } else {
            cotaInicial = datosPrevios.cotaInicial || "0.000";
            geoValores = datosPrevios.geoValores || ["2", "2", "2", "2", "2", "2", "2", "2"];
            tituloPrevio = datosPrevios.tituloPrevio || "CONTROL DE SUB BASE";
            progValor = datosPrevios.progValor || "0+000";
            inputPvValores = datosPrevios.inputPvValores || ["", "", "", "", "", ""];
            inputEjeValor = datosPrevios.inputEjeValor || "";
            inputLectExistValores = datosPrevios.inputLectExistValores || ["", "", "", "", "", "", ""];
        }

        const div = document.createElement('div');
        div.className = 'sub-block';
        div.id = id;

        div.innerHTML = `
            <button class="btn-eliminar-bloque" onclick="eliminarBloque('${id}')" style="display:${isUnlocked ? 'flex' : 'none'};">×</button>
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; padding-right: 30px;">
                <div>
                    <b style="color:var(--subbase-color); font-size:0.85rem;">TIPO:</b> 
                    <input type="text" class="titulo-input" value="${tituloPrevio}" oninput="registrarCambio()">
                </div>
                <div>
                    <b style="color:var(--subbase-color); font-size:0.85rem;">PROGRESIVA:</b> 
                    <input type="text" class="prog-in" value="${progValor}" oninput="registrarCambio()">
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <tbody>
                        <tr>
                            <td colspan="2" rowspan="2" class="w-control" style="background:#cfd8dc; color:#263238;">CONTROL</td>
                            <td class="header-pv w-header-pv">Cota P.F</td><td class="header-pv">Lectura</td>
                            <td class="header-pv">P.P 1</td><td class="header-pv">P.P 2</td>
                            <td class="header-pv">P.P 3</td><td class="header-pv">P.P 4</td>
                            <td class="header-pv" style="background:#2ecc71; color:black; font-weight:800;">P.V. FINAL</td>
                            <td colspan="8" class="header-geom">GEOMETRÍA DE DISEÑO</td>
                        </tr>
                        <tr>
                            <td style="background:#e8f4fd"><input type="number" step="0.001" class="calc-pv cota-pf-input" value="${cotaInicial}" oninput="calcular('${id}'); registrarCambio();
