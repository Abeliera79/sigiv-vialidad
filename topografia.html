<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.I.V. - Área de Topografía</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: white;
        }

        .background {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('fondo_topografia.jpg') no-repeat center center fixed;
            background-size: cover; 
            height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 40px;
            width: 95%;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }

        h1 {
            color: #ffd700;
            font-weight: 800;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .sub-tag {
            background: rgba(166, 124, 82, 0.2);
            color: #ffd700;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 25px;
            border: 1px solid rgba(166, 124, 82, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Cuadrícula de Botones: 2 columnas */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Ajuste para celulares: 1 sola columna */
        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        .btn-menu {
            background: rgba(255, 255, 255, 0.04);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 18px 15px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-menu:hover {
            background: rgba(166, 124, 82, 0.15);
            border-color: #ffd700;
            transform: scale(1.02);
            color: #ffd700;
            box-shadow: 0 0 15px rgba(166, 124, 82, 0.4);
        }

        .btn-volver {
            margin-top: 30px;
            background: transparent;
            border: 2px solid #ff6b6b;
            color: #ff6b6b;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-volver:hover {
            background: #ff6b6b;
            color: white;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.4);
        }

        .credits {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="background">
    <div class="glass-panel">
        <h1>Módulo de Topografía</h1>
        <div class="sub-tag">S.I.G.I.V. - Control Altamétrico y Planimétrico</div>

        <div class="menu-grid">
            <button class="btn-menu" onclick="window.location.href='top_levantamientos.html'">
                🌐 Levantamientos Previos/Definitivos
            </button>
            <button class="btn-menu" onclick="window.location.href='top_subrasante.html'">
                📉 Nivelación Sub-Rasante
            </button>
            <button class="btn-menu" onclick="window.location.href='top_subbase.html'">
                📊 Nivelación Sub-Base
            </button>
            <button class="btn-menu" onclick="window.location.href='top_base.html'">
                📈 Nivelación Base
            </button>
            <button class="btn-menu" onclick="window.location.href='top_cordones.html'">
                🧱 Nivelación Cordones
            </button>
            <button class="btn-menu" onclick="window.location.href='top_varias.html'">
                ⚙️ Nivelaciones Varias
            </button>
        </div>

        <button class="btn-volver" onclick="window.location.href='control_obra.html'">
            ⬅ Volver al Control de Obra
        </button>
    </div>

    <div class="credits">S.I.G.I.V. - Gestión de Campo</div>
</div>

</body>
</html>
